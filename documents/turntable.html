<<!DOCTYPE html>
<html lang="en">

}

        0
        0;

   ------------------------------------------------------------ */

#controls{

<script type="module">


import * as THREE from "three";


import { STLLoader } from
    "three/addons/loaders/STLLoader.js";


import { OrbitControls } from
    "three/addons/controls/OrbitControls.js";


import * as BufferGeometryUtils from
    "three/addons/utils/BufferGeometryUtils.js";


/*
 * ============================================================
 * DOM
 * ============================================================
 */

const container =
    document.getElementById(
        "scene-container"
    );


const spinButton =
    document.getElementById(
        "spin-button"
    );


const resetButton =
    document.getElementById(
        "reset-button"
    );


const loadingElement =
    document.getElementById(
        "loading"
    );


/*
 * ============================================================
 * SCENE

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0xe86b26
    );


/*
 * ============================================================
 * CAMERA
 * ============================================================
 */

const camera =
    new THREE.PerspectiveCamera(

        42,

        window.innerWidth /
        window.innerHeight,

        0.1,

        100
    );


const cameraHome =
    new THREE.Vector3(
        0,
        4.9,
        7.8
    );


const cameraTarget =
    new THREE.Vector3(
        0,
        1.45,
        0
    );


camera.position.copy(
    cameraHome
);


camera.lookAt(
    cameraTarget
);


/*
 * ============================================================
 * RENDERER
 * ============================================================
 */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        alpha:false
    });


renderer.setSize(

    window.innerWidth,

    window.innerHeight
);


renderer.setPixelRatio(

    Math.min(

        window.devicePixelRatio,

        2
    )
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    0.94;


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


container.appendChild(
    renderer.domElement
);


/*
 * ============================================================
 * ORBIT CONTROLS
 * ============================================================
 */

const controls =
    new OrbitControls(

        camera,

        renderer.domElement
    );


controls.enableDamping =
    true;


controls.dampingFactor =
    0.055;


controls.target.copy(
    cameraTarget
);


controls.enableRotate =
    true;


controls.enableZoom =
    true;


controls.enablePan =
    true;


controls.minDistance =
    4.5;


controls.maxDistance =
    14;


controls.minPolarAngle =
    THREE.MathUtils.degToRad(
        18
    );


controls.maxPolarAngle =
    THREE.MathUtils.degToRad(
        82
    );


controls.update();


/*
 * ============================================================
 * LIGHTING
 * ============================================================
 */


/*
 * Soft overall illumination.
 */

const ambientLight =
    new THREE.AmbientLight(

        0xffdcb6,

        0.52
    );


scene.add(
    ambientLight
);


/*
 * Warm sky / dark-orange ground contribution.
 */

const hemisphereLight =
    new THREE.HemisphereLight(

        0xffe8c7,

        0x713316,

        0.68
    );


scene.add(
    hemisphereLight
);


/*
 * Main directional key.
 */

const keyLight =
    new THREE.DirectionalLight(

        0xffc56c,

        4.4
    );


keyLight.position.set(

    -6.5,

    9.5,

    5.5
);


keyLight.castShadow =
    true;


keyLight.shadow.mapSize.set(

    2048,

    2048
);


keyLight.shadow.camera.left =
    -7;


keyLight.shadow.camera.right =
    7;


keyLight.shadow.camera.top =
    7;


keyLight.shadow.camera.bottom =
    -7;


keyLight.shadow.camera.near =
    0.1;


keyLight.shadow.camera.far =
    25;


keyLight.shadow.bias =
    -0.00025;


keyLight.shadow.normalBias =
    0.018;


scene.add(
    keyLight
);


/*
 * Cooler fill from the opposite side.
 */

const fillLight =
    new THREE.DirectionalLight(

        0xfff0dc,

        1.15
    );


fillLight.position.set(

    6.5,

    5,

    3
);


scene.add(
    fillLight
);


/*
 * Warm rim light.
 */

const rimLight =
    new THREE.DirectionalLight(

        0xff8a38,

        2.0
    );


rimLight.position.set(

    3,

    7,

    -6
);


scene.add(
    rimLight
);


/*
 * Small front highlight to help reveal texture detail.
 */

const frontLight =
    new THREE.PointLight(

        0xffcb88,

        4.8,

        17,

        2
    );


frontLight.position.set(

    -1.4,

    4.6,

    5.2
);


scene.add(
    frontLight
);


/*
 * ============================================================
 * FLOOR
 * ============================================================
 */

const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(

            28,

            28
        ),

        new THREE.MeshStandardMaterial({

            color:
                0xe86824,

            roughness:
                0.90,

                0
        })
    );


floor.rotation.x =
    -Math.PI /
    2;


floor.receiveShadow =

scene.add(

/*
 * ============================================================
 * TURNTABLE PLATFORM
 * ============================================================
 */

const turntableGroup =
    new THREE.Group();


scene.add(
    turntableGroup
);


/*
 * White ceramic display pedestal.
 */

const pedestalMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0xf4ede0,

        roughness:
            0.22,

        metalness:
            0
    });


const pedestalBase =
    new THREE.Mesh(

        new THREE.CylinderGeometry(

            3.35,

            3.55,

            0.34,

            96
        ),

        pedestalMaterial
    );


pedestalBase.position.y =
    0.18;


pedestalBase.castShadow =
    true;


pedestalBase.receiveShadow =
    true;


scene.add(
    pedestalBase
);


/*
 * Slightly raised top surface.
 */

const pedestalTop =
    new THREE.Mesh(

        new THREE.CylinderGeometry(

            3.18,

            3.28,

            0.16,

            96
        ),

        new THREE.MeshStandardMaterial({

            color:
                0xf9f5eb,

            roughness:
                0.16,

            metalness:
                0
        })
    );


pedestalTop.position.y =
    0.40;


pedestalTop.castShadow =
    true;


pedestalTop.receiveShadow =
    true;


scene.add(
    pedestalTop

/*
 * Thin blue decorative ring.
 */

const blueRing =
    new THREE.Mesh(

        new THREE.TorusGeometry(

            3.08,

            0.035,

            10,

            96
        ),

        new THREE.MeshStandardMaterial({

            color:
                0x274a77,

            roughness:
                0.26,

            metalness:
                0
        })

blueRing.rotation.x =
    Math.PI /
    2;


blueRing.position.y =

    blueRing

/*
 * ============================================================
 * CONTACT SHADOW
 * ============================================================
 */

function createContactShadowTexture(){

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        256;


    canvas.height =
        256;


    const context =
        canvas.getContext(
            "2d"
        );


    const gradient =
        context.createRadialGradient(

            128,

            128,

            0,

            128,

            128,

            128
        );


    gradient.addColorStop(

        0,

        "rgba(20,8,3,0.58)"
    );


    gradient.addColorStop(

        0.42,

        "rgba(20,8,3,0.25)"
    );


    gradient.addColorStop(

        0.76,

        "rgba(20,8,3,0.07)"
    );


    gradient.addColorStop(

        1,

        "rgba(20,8,3,0)"
    );


    context.fillStyle =
        gradient;


    context.fillRect(

        0,

        0,

        256,

        256
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.colorSpace =
        THREE.NoColorSpace;


    return texture;
}


const contactShadowTexture =
    createContactShadowTexture();


const cookieContactShadow =
    new THREE.Mesh(

        new THREE.PlaneGeometry(

            4.5,

            4.1
        ),

        new THREE.MeshBasicMaterial({

            map:
                contactShadowTexture,

            transparent:
                true,

            opacity:
                0.18,

            depthWrite:
                false,

            toneMapped:
                false
        })
    );


cookieContactShadow.rotation.x =
    -Math.PI /
    2;


cookieContactShadow.position.y =
    0.505;


scene.add(
    cookieContactShadow
);


/*
 * ============================================================
 * FILE PATHS
 * ============================================================
 */

const modelPath =
    "./models/almond_whole_body.stl";


const texturePaths = {

    shellSurfaceColor:
        "./textures/almond_shell_surface_basecolor.png",

    shellSurfaceRoughness:
        "./textures/almond_shell_surface_roughness.png",

    shellRidgesColor:
        "./textures/almond_shell_ridges_basecolor.png",

    shellRidgesRoughness:
        "./textures/almond_shell_ridges_roughness.png"
};


/*
 * ============================================================
 * LOADERS
 * ============================================================
 */

const stlLoader =
    new STLLoader();


const textureLoader =
    new THREE.TextureLoader();


async function loadTexture(
    path
){

    const texture =
        await textureLoader.loadAsync(
            path
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.minFilter =
        THREE.LinearMipmapLinearFilter;


    texture.magFilter =
        THREE.LinearFilter;


    texture.anisotropy =
        Math.min(

            8,

            renderer
                .capabilities
                .getMaxAnisotropy()
        );


    /*
     * Color textures are decoded manually inside the shader.
     */

    texture.colorSpace =
        THREE.NoColorSpace;


    texture.needsUpdate =
        true;


    return texture;
}


/*
 * ============================================================
 * SOFTEN PASTRY GEOMETRY
 * ============================================================
 */

function smoothstepValue(
    edge0,
    edge1,
    value
){

    const t =
        THREE.MathUtils.clamp(

            (
                value -
                edge0
            ) /
            (
                edge1 -
                edge0
            ),

            0,

            1
        );


    return (
        t *
        t *
        (
            3 -
            2 *
            t
        )
    );
}


function softenPastryGeometry(
    sourceGeometry,
    modelCenter,
    modelSize
){

    const geometry =
        sourceGeometry.clone();


    const position =
        geometry.getAttribute(
            "position"
        );


    const radius =
        Math.max(

            modelSize.x,

            modelSize.y
        ) *
        0.5;


    const halfHeight =
        modelSize.z *
        0.5;


    /*
     * Same rounded-edge values used in the main project.
     */

    const outerStart =
        0.84;


    const capStart =
        0.56;


    const radialRoundness =
        0.070;


    const verticalRoundness =
        0.095;


    const sidePuff =
        0.012;


    for(

        let index = 0;

        index < position.count;

        index += 1

    ){

        let x =
            position.getX(
                index
            ) -
            modelCenter.x;


        let y =
            position.getY(
                index
            ) -
            modelCenter.y;


        let z =
            position.getZ(
                index
            ) -
            modelCenter.z;


        const radialDistance =
            Math.hypot(
                x,
                y
            );


        const radialNormalized =
            THREE.MathUtils.clamp(

                radialDistance /
                Math.max(
                    radius,
                    0.000001
                ),

                0,

                1.25
            );


        const heightNormalized =
            THREE.MathUtils.clamp(

                Math.abs(
                    z
                ) /
                Math.max(
                    halfHeight,
                    0.000001
                ),

                0,

                1.25
            );


        const outerBand =
            smoothstepValue(

                outerStart,

                1,

                radialNormalized
            );


        const capBand =
            smoothstepValue(

                capStart,

                1,

                heightNormalized
            );


        const cornerBand =
            outerBand *
            capBand;


        const middleBand =
            outerBand *
            (
                1 -
                smoothstepValue(
                    0.35,
                    0.90,
                    heightNormalized
                )
            );


        const radialFactor =
            1 -
            radialRoundness *
            cornerBand +
            sidePuff *
            middleBand;


        x *=
            radialFactor;


        y *=
            radialFactor;


        z *=
            1 -
            verticalRoundness *
            cornerBand;


        position.setXYZ(

            index,

            x +
            modelCenter.x,

            y +
            modelCenter.y,

            z +
            modelCenter.z
        );
    }


    position.needsUpdate =
        true;


    geometry.computeBoundingBox();


    geometry.computeBoundingSphere();


    /*
     * Preserve decorative creases while smoothing
     * unwanted faceting around the perimeter.
     */

    const softenedGeometry =
        BufferGeometryUtils
            .toCreasedNormals(

                geometry,

                THREE.MathUtils
                    .degToRad(
                        58
                    )
            );


    softenedGeometry.computeBoundingBox();


    softenedGeometry.computeBoundingSphere();


    return softenedGeometry;
}


/*
 * ============================================================
 * ALMOND PASTRY TRIPLANAR SHADER
 * ============================================================
 */

function createPastryMaterial(
    maps,
    textureScale
){

    const material =
        new THREE.MeshStandardMaterial({

            color:
                0xd3a061,

            roughness:
                0.84,

            metalness:
                0
        });


    const uniforms = {

        uTextureScale:{
            value:
                textureScale
        },

        uShellSurfaceColor:{
            value:
                maps.shellSurfaceColor
        },

        uShellSurfaceRoughness:{
            value:
                maps.shellSurfaceRoughness
        },

        uShellRidgesColor:{
            value:
                maps.shellRidgesColor
        },

        uShellRidgesRoughness:{
            value:
                maps.shellRidgesRoughness
        }
    };


    material.userData.uniforms =
        uniforms;


    material.onBeforeCompile =
        function(
            shader
        ){

            Object.assign(

                shader.uniforms,

                uniforms
            );


            /*
             * Pass object-space coordinates to fragment shader.
             */

            shader.vertexShader =
                shader.vertexShader.replace(

                    "#include <common>",

                    `#include <common>

                    varying vec3
                        vObjectPosition;

                    varying vec3
                        vObjectNormal;`
                );


            shader.vertexShader =
                shader.vertexShader.replace(

                    "#include <beginnormal_vertex>",

                    `#include <beginnormal_vertex>

                    vObjectNormal =
                        normalize(
                            objectNormal
                        );`
                );


            shader.vertexShader =
                shader.vertexShader.replace(

                    "#include <begin_vertex>",

                    `#include <begin_vertex>

                    vObjectPosition =
                        transformed;`
                );


            shader.fragmentShader =
                shader.fragmentShader.replace(

                    "#include <common>",

                    `#include <common>

                    uniform float
                        uTextureScale;

                    uniform sampler2D
                        uShellSurfaceColor;

                    uniform sampler2D
                        uShellSurfaceRoughness;

                    uniform sampler2D
                        uShellRidgesColor;

                    uniform sampler2D
                        uShellRidgesRoughness;

                    varying vec3
                        vObjectPosition;

                    varying vec3
                        vObjectNormal;

                    float customRoughness =
                        0.8;


                    float hash31(
                        vec3 p
                    ){

                        p =
                            fract(
                                p *
                                0.1031
                            );

                        p +=
                            dot(
                                p,
                                p.yzx +
                                33.33
                            );

                        return fract(
                            (
                                p.x +
                                p.y
                            ) *
                            p.z
                        );
                    }


                    float noise3(
                        vec3 p
                    ){

                        vec3 i =
                            floor(
                                p
                            );

                        vec3 f =
                            fract(
                                p
                            );

                        f =
                            f *
                            f *
                            (
                                3.0 -
                                2.0 *
                                f
                            );

                        float n000 =
                            hash31(
                                i
                            );

                        float n100 =
                            hash31(
                                i +
                                vec3(
                                    1,
                                    0,
                                    0
                                )
                            );

                        float n010 =
                            hash31(
                                i +
                                vec3(
                                    0,
                                    1,
                                    0
                                )
                            );

                        float n110 =
                            hash31(
                                i +
                                vec3(
                                    1,
                                    1,
                                    0
                                )
                            );

                        float n001 =
                            hash31(
                                i +
                                vec3(
                                    0,
                                    0,
                                    1
                                )
                            );

                        float n101 =
                            hash31(
                                i +
                                vec3(
                                    1,
                                    0,
                                    1
                                )
                            );

                        float n011 =
                            hash31(
                                i +
                                vec3(
                                    0,
                                    1,
                                    1
                                )
                            );

                        float n111 =
                            hash31(
                                i +
                                vec3(
                                    1,
                                    1,
                                    1
                                )
                            );

                        float nx00 =
                            mix(
                                n000,
                                n100,
                                f.x
                            );

                        float nx10 =
                            mix(
                                n010,
                                n110,
                                f.x
                            );

                        float nx01 =
                            mix(
                                n001,
                                n101,
                                f.x
                            );

                        float nx11 =
                            mix(
                                n011,
                                n111,
                                f.x
                            );

                        return mix(

                            mix(
                                nx00,
                                nx10,
                                f.y
                            ),

                            mix(
                                nx01,
                                nx11,
                                f.y
                            ),

                            f.z
                        );
                    }


                    vec3 saturateColor(
                        vec3 colorValue,
                        float amount
                    ){

                        float luminance =
                            dot(

                                colorValue,

                                vec3(
                                    0.299,
                                    0.587,
                                    0.114
                                )
                            );


                        return mix(

                            vec3(
                                luminance
                            ),

                            colorValue,

                            amount
                        );
                    }


                    vec3 adjustContrast(
                        vec3 colorValue,
                        float contrastValue
                    ){

                        return (
                            colorValue -
                            0.5
                        ) *
                        contrastValue +
                        0.5;
                    }


                    vec3 getTriWeights(
                        vec3 normalValue
                    ){

                        vec3 weights =
                            pow(

                                abs(
                                    normalize(
                                        normalValue
                                    )
                                ),

                                vec3(
                                    5.0
                                )
                            );


                        weights /=
                            max(

                                weights.x +
                                weights.y +
                                weights.z,

                                0.0001
                            );


                        return weights;
                    }


                    vec3 sampleTriColor(
                        sampler2D textureMap,
                        vec3 positionValue,
                        vec3 normalValue,
                        float scaleValue
                    ){

                        vec3 weights =
                            getTriWeights(
                                normalValue
                            );


                        vec3 xSample =
                            texture2D(

                                textureMap,

                                positionValue.yz *
                                scaleValue
                            ).rgb;


                        vec3 ySample =
                            texture2D(

                                textureMap,

                                positionValue.xz *
                                scaleValue
                            ).rgb;


                        vec3 zSample =
                            texture2D(

                                textureMap,

                                positionValue.xy *
                                scaleValue
                            ).rgb;


                        /*
                         * Manual sRGB-style decoding.
                         */

                        xSample =
                            pow(

                                max(
                                    xSample,
                                    vec3(0)
                                ),

                                vec3(
                                    2.2
                                )
                            );


                        ySample =
                            pow(

                                max(
                                    ySample,
                                    vec3(0)
                                ),

                                vec3(
                                    2.2
                                )
                            );


                        zSample =
                            pow(

                                max(
                                    zSample,
                                    vec3(0)
                                ),

                                vec3(
                                    2.2
                                )
                            );


                        return
                            xSample *
                            weights.x +

                            ySample *
                            weights.y +

                            zSample *
                            weights.z;
                    }


                    float sampleTriValue(
                        sampler2D textureMap,
                        vec3 positionValue,
                        vec3 normalValue,
                        float scaleValue
                    ){

                        vec3 weights =
                            getTriWeights(
                                normalValue
                            );


                        return
                            texture2D(

                                textureMap,

                                positionValue.yz *
                                scaleValue
                            ).r *
                            weights.x +

                            texture2D(

                                textureMap,

                                positionValue.xz *
                                scaleValue
                            ).r *
                            weights.y +

                            texture2D(

                                textureMap,

                                positionValue.xy *
                                scaleValue
                            ).r *
                            weights.z;
                    }`
                );


            /*
             * Replace base color with texture-driven pastry color.
             */

            shader.fragmentShader =
                shader.fragmentShader.replace(

                    "#include <color_fragment>",

                    `#include <color_fragment>

                    vec3 normalValue =
                        normalize(
                            vObjectNormal
                        );


                    float topWeight =
                        smoothstep(

                            0.34,

                            0.82,

                            abs(
                                normalValue.z
                            )
                        );


                    vec3 surfaceColor =
                        sampleTriColor(

                            uShellSurfaceColor,

                            vObjectPosition,

                            normalValue,

                            uTextureScale
                        );


                    vec3 ridgeColor =
                        sampleTriColor(

                            uShellRidgesColor,

                            vObjectPosition,

                            normalValue,

                            uTextureScale
                        );


                    float surfaceRoughness =
                        sampleTriValue(

                            uShellSurfaceRoughness,

                            vObjectPosition,

                            normalValue,

                            uTextureScale
                        );


                    float ridgeRoughness =
                        sampleTriValue(

                            uShellRidgesRoughness,

                            vObjectPosition,

                            normalValue,

                            uTextureScale
                        );


                    vec3 textureColor =
                        mix(

                            ridgeColor,

                            surfaceColor,

                            topWeight
                        );


                    float textureRoughness =
                        mix(

                            ridgeRoughness,

                            surfaceRoughness,

                            topWeight
                        );


                    /*
                     * Add subtle baked color variation.
                     */

                    float bakeNoise =
                        noise3(
                            vObjectPosition *
                            0.19
                        );


                    float fineSpeckle =
                        noise3(
                            vObjectPosition *
                            0.75
                        );


                    textureColor *=
                        0.90 +
                        bakeNoise *
                        0.18;


                    textureColor *=
                        0.96 +
                        fineSpeckle *
                        0.06;


                    /*
                     * Slightly darken side surfaces.
                     */

                    textureColor *=
                        1.0 -
                        (
                            1.0 -
                            topWeight
                        ) *
                        0.12;


                    textureColor =
                        saturateColor(

                            textureColor,

                            1.20
                        );


                    textureColor =
                        adjustContrast(

                            textureColor,

                            1.15
                        );


                    textureColor.r *=
                        1.03;


                    textureColor.g *=
                        1.01;


                    textureRoughness =
                        clamp(

                            0.72 +
                            textureRoughness *
                            0.22,

                            0.66,

                            0.98
                        );


                    diffuseColor.rgb =
                        textureColor;


                    customRoughness =
                        textureRoughness;`
                );


            /*
             * Drive material roughness from triplanar maps.
             */

            shader.fragmentShader =
                shader.fragmentShader.replace(

                    "#include <roughnessmap_fragment>",

                    `#include <roughnessmap_fragment>

                    roughnessFactor =
                        mix(

                            roughnessFactor,

                            customRoughness,

                            0.96
                        );`
                );
        };


    material.customProgramCacheKey =
        function(){

            return "almond-turntable-final";
        };


    return material;
}


/*
 * ============================================================
 * MODEL STATE
 * ============================================================
 */

let modelRoot =
    null;


let ready =
    false;


let spinEnabled =
    true;


/*
 * Turntable speed in radians per second.
 *
 * 0.48 rad/s gives one complete rotation
 * in approximately 13 seconds.
 */

const SPIN_SPEED =
    0.48;


/*
 * ============================================================
 * LOAD MODEL
 * ============================================================
 */

async function buildTurntable(){

    try{

        /*
         * Load STL and texture maps in parallel.
         */

        const [

            geometry,

            shellSurfaceColor,

            shellSurfaceRoughness,

            shellRidgesColor,

            shellRidgesRoughness

        ] =
            await Promise.all([

                new Promise(
                    (
                        resolve,
                        reject
                    ) => {

                        stlLoader.load(

                            modelPath,

                            function(
                                loadedGeometry
                            ){

                                loadedGeometry
                                    .computeVertexNormals();


                                loadedGeometry
                                    .computeBoundingBox();


                                resolve(
                                    loadedGeometry
                                );
                            },

                            undefined,

                            reject
                        );
                    }
                ),


                loadTexture(
                    texturePaths
                        .shellSurfaceColor
                ),


                loadTexture(
                    texturePaths
                        .shellSurfaceRoughness
                ),


                loadTexture(
                    texturePaths
                        .shellRidgesColor
                ),


                loadTexture(
                    texturePaths
                        .shellRidgesRoughness
                )
            ]);


        /*
         * Measure source geometry.
         */

        const modelCenter =
            new THREE.Vector3();


        const modelSize =
            new THREE.Vector3();


        geometry
            .boundingBox
            .getCenter(
                modelCenter
            );


        geometry
            .boundingBox
            .getSize(
                modelSize
            );


        const sourceDiameter =
            Math.max(

                modelSize.x,

                modelSize.y
            );


        if(
            !Number.isFinite(
                sourceDiameter
            ) ||

            sourceDiameter <=
            0
        ){

            throw new Error(
                "Invalid almond pastry geometry."
            );
        }


        /*
         * Match the same approximate scale
         * used by the main animation.
         */

        const modelScale =
            3.65 /
            sourceDiameter;


        /*
         * Create softened final geometry.
         */

        const softenedGeometry =
            softenPastryGeometry(

                geometry,

                modelCenter,

                modelSize
            );


        /*
         * Texture scale matches the main project logic.
         */

        const textureScale =
            4.8 /
            sourceDiameter;


        const pastryMaterial =
            createPastryMaterial(

                {
                    shellSurfaceColor,
                    shellSurfaceRoughness,
                    shellRidgesColor,
                    shellRidgesRoughness
                },

                textureScale
            );


        /*
         * Main rotating group.
         */

        modelRoot =
            new THREE.Group();


        turntableGroup.add(
            modelRoot
        );


        /*
         * Convert OpenSCAD Z-up to Three.js Y-up.
         */

        const visualRoot =
            new THREE.Group();


        visualRoot.rotation.x =
            -Math.PI /
            2;


        visualRoot.scale.setScalar(
            modelScale
        );


        modelRoot.add(
            visualRoot
        );


        const pastryMesh =
            new THREE.Mesh(

                softenedGeometry,

                pastryMaterial
            );


        pastryMesh.position.set(

            -modelCenter.x,

            -modelCenter.y,

            -modelCenter.z
        );


        pastryMesh.castShadow =
            true;


        pastryMesh.receiveShadow =
            true;


        visualRoot.add(
            pastryMesh
        );


        /*
         * Place cookie slightly above the platform.
         */

        const renderedHeight =
            modelSize.z *
            modelScale;


        modelRoot.position.y =
            0.50 +
            renderedHeight *
            0.5 +
            0.035;


        /*
         * Begin from a slightly rotated position so
         * the first frame is not perfectly symmetrical.
         */

        modelRoot.rotation.y =
            THREE.MathUtils
                .degToRad(
                    -18
                );


        /*
         * Finish loading UI.
         */

        ready =
            true;


        spinEnabled =
            true;


        spinButton.disabled =
            false;


        resetButton.disabled =
            false;


        spinButton.textContent =
            "Pause Spin";


        loadingElement.style.display =
            "none";
    }


    catch(
        error
    ){

        console.error(
            "Turntable initialization error:",
            error
        );


        loadingElement.textContent =
            "LOAD FAILED — check model / texture paths";
    }
}


/*
 * ============================================================
 * SPIN CONTROL
 * ============================================================
 */

function toggleSpin(){

    if(
        !ready
    ){
        return;
    }


    spinEnabled =
        !spinEnabled;


    spinButton.textContent =
        spinEnabled

            ? "Pause Spin"

            : "Resume Spin";
}


/*
 * ============================================================
 * RESET CAMERA
 * ============================================================
 */

function resetView(){

    if(
        !ready
    ){
        return;
    }


    camera.position.copy(
        cameraHome
    );


    controls.target.copy(
        cameraTarget
    );


    camera.lookAt(
        cameraTarget
    );


    controls.update();


    /*
     * Reset model rotation as well.
     */

    modelRoot.rotation.y =
        THREE.MathUtils
            .degToRad(
                -18
            );
}


/*
 * ============================================================
 * BUTTON EVENTS
 * ============================================================
 */

spinButton.addEventListener(

    "click",

    toggleSpin
);


resetButton.addEventListener(

    "click",

    resetView
);


/*
 * ============================================================
 * BUILD
 * ============================================================
 */

buildTurntable();


/*
 * ============================================================
 * ANIMATION LOOP
 * ============================================================
 */

const clock =
    new THREE.Clock();


renderer.setAnimationLoop(

    function(){

        const deltaTime =
            Math.min(

                clock.getDelta(),

                0.05
            );


        /*
         * Rotate around the Three.js world Y axis.
         *
         * OrbitControls remain usable whether the
         * automatic spin is running or paused.
         */

        if(
            ready &&
            spinEnabled
        ){

            modelRoot.rotation.y +=
                SPIN_SPEED *
                deltaTime;
        }


        controls.update();


        renderer.render(
            scene,
            camera
        );
    }
);


/*
 * ============================================================
 * RESIZE
 * ============================================================
 */

window.addEventListener(

    "resize",

    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight
        );


        renderer.setPixelRatio(

            Math.min(

                window.devicePixelRatio,

                2
            )
        );
    }
);


</script>
