/* ============================================================
   CRYSTAL SECTION FACING CAMERA
   ============================================================ */

function prepareCrystalFacingCamera(){

    scene.updateMatrixWorld(
        true
    );


    const cakeWorld =
        new THREE.Vector3();

    crystalTarget.getWorldPosition(
        cakeWorld
    );


    const desiredDirection =
        camera.position
            .clone()
            .sub(
                cakeWorld
            );


    desiredDirection.y =
        0;


    if(
        desiredDirection.lengthSq() <
        0.000001
    ){

        desiredDirection.set(
            0,
            0,
            -1
        );
    }


    desiredDirection.normalize();


    const zAxis =
        desiredDirection
            .clone()
            .negate();


    const upReference =
        new THREE.Vector3(
            0,
            1,
            0
        );


    const xAxis =
        new THREE.Vector3()
            .crossVectors(
                upReference,
                zAxis
            );


    if(
        xAxis.lengthSq() <
        0.000001
    ){

        xAxis.set(
            1,
            0,
            0
        );
    }


    xAxis.normalize();


    const yAxis =
        new THREE.Vector3()
            .crossVectors(
                zAxis,
                xAxis
            )
            .normalize();


    const worldBasis =
        new THREE.Matrix4()
            .makeBasis(
                xAxis,
                yAxis,
                zAxis
            );


    const desiredWorldQuaternion =
        new THREE.Quaternion()
            .setFromRotationMatrix(
                worldBasis
            );


    const parentWorldQuaternion =
        new THREE.Quaternion();


    chopstickGroup.getWorldQuaternion(
        parentWorldQuaternion
    );


    crystalFaceStartQuaternion.copy(
        crystalTarget
            .userData
            .jelly
            .baseQuaternion
    );


    crystalFaceTargetQuaternion.copy(
        parentWorldQuaternion
            .clone()
            .invert()
            .multiply(
                desiredWorldQuaternion
            )
    );
}


/* ============================================================
   PLAY / PAUSE
   ============================================================ */

function syncButtons(){

    if(
        !ready
    ){

        playButton.disabled =
            true;

        pauseButton.disabled =
            true;

        return;
    }


    if(
        isPaused
    ){

        playButton.textContent =
            "Resume";

        playButton.disabled =
            false;

        pauseButton.disabled =
            true;

        return;
    }


    playButton.textContent =
        sequenceState ===
        "complete"
            ? "Replay"
            : "Play";


    playButton.disabled =
        isPlaying;


    pauseButton.disabled =
        !isPlaying;
}


/*
 * IMPORTANT:
 *
 * Pause stops only animation simulation.
 * OrbitControls are explicitly enabled.
 */

function pauseSequence(){

    if(
        !isPlaying ||
        isPaused
    ){
        return;
    }


    isPaused =
        true;


    /*
     * This is the key difference from the previous version.
     */

    controls.enabled =
        true;


    syncButtons();
}


/*
 * Resume animation from exactly the paused simulation frame.
 *
 * The camera remains wherever the user moved it while paused.
 */

function playOrResume(){

    if(
        !ready
    ){
        return;
    }


    if(
        isPaused
    ){

        isPaused =
            false;


        /*
         * Lock interaction again while the animation moves.
         */

        controls.enabled =
            false;


        syncButtons();

        return;
    }


    if(
        isPlaying
    ){
        return;
    }


    resetSequence();


    isPlaying =
        true;

    isPaused =
        false;


    controls.enabled =
        false;


    enterState(
        "almondApproach"
    );


    syncButtons();
}


/* ============================================================
   RESET
   ============================================================ */

function resetSequence(){

    isPlaying =
        false;

    isPaused =
        false;

    sequenceState =
        "idle";

    stateTime =
        0;

    sceneTime =
        0;


    steamVisible =
        false;


    if(
        steamGroup
    ){

        steamGroup.visible =
            false;
    }


    for(
        const particle
        of steamParticles
    ){

        resetSteamParticle(
            particle,
            true
        );
    }


    clearCrumbs();


    plateStageGroup.position.set(
        PLATE_START_X,
        0,
        0
    );


    restoreLowerCookies();


    if(
        targetCookie.parent !==
        plateStageGroup
    ){

        plateStageGroup.attach(
            targetCookie
        );
    }


    targetCookie.position.copy(
        targetCookieHome
    );


    targetCookie.rotation.set(
        0,
        0,
        0
    );


    showAlmondWhole();


    if(
        steamerStageGroup
    ){

        steamerStageGroup.position.x =
            STEAMER_START_X;

        steamerStageGroup.position.z =
            STEAMER_START_Z;
    }


    if(
        crystalTarget &&
        crystalTarget.parent !==
        steamerStageGroup
    ){

        steamerStageGroup.attach(
            crystalTarget
        );
    }


    for(
        const cake
        of crystalCakes
    ){

        const data =
            cake.userData.jelly;


        cake.position.copy(
            data.homePosition
        );


        cake.quaternion.copy(
            data.homeQuaternion
        );


        cake.scale.set(
            1,
            1,
            1
        );


        data.baseQuaternion.copy(
            data.homeQuaternion
        );


        data.energy =
            0;


        data.biteCompression =
            0;


        showCrystalWhole(
            cake
        );
    }


    chopstickGroup.visible =
        true;


    chopstickGroup.position.copy(
        almondStartPosition
    );


    chopstickGroup.quaternion.copy(
        almondGripQuaternion
    );


    setChopstickGap(
        almondOpenGap,
        0.065
    );


    /*
     * Replay starts from the official camera.
     */

    camera.position.copy(
        cameraInitialPosition
    );


    controls.target.copy(
        cameraInitialTarget
    );


    camera.lookAt(
        cameraInitialTarget
    );


    controls.enabled =
        true;


    controls.update();


    syncButtons();
}


/* ============================================================
   FULL SEQUENCE
   ============================================================ */

function updateSequence(
    deltaTime,
    elapsedTime
){

    if(
        !isPlaying ||
        isPaused
    ){
        return;
    }


    stateTime +=
        deltaTime;


    /* ALMOND APPROACH */

    if(
        sequenceState ===
        "almondApproach"
    ){

        const raw =
            stateTime /
            durations.almondApproach;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                almondStartPosition,
                almondGripPosition,
                progress
            );


        chopstickGroup.quaternion.copy(
            almondGripQuaternion
        );


        setChopstickGap(
            almondOpenGap,
            0.065
        );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                almondGripPosition
            );

            enterState(
                "almondClose"
            );
        }

        return;
    }


    /* ALMOND CLOSE */

    if(
        sequenceState ===
        "almondClose"
    ){

        const raw =
            stateTime /
            durations.almondClose;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        setChopstickGap(
            THREE.MathUtils.lerp(
                almondOpenGap,
                almondGripGap,
                progress
            ),
            THREE.MathUtils.lerp(
                0.065,
                0.010,
                progress
            )
        );


        if(
            raw >=
            1
        ){

            setChopstickGap(
                almondGripGap,
                0.010
            );


            attachAlmond();

            spawnAlmondLiftCrumbs();

            enterState(
                "almondLift"
            );
        }

        return;
    }


    /* ALMOND LIFT */

    if(
        sequenceState ===
        "almondLift"
    ){

        const raw =
            stateTime /
            durations.almondLift;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                almondGripPosition,
                almondLiftPosition,
                progress
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                almondLiftPosition
            );


            almondFirstBitePosition
                .copy(
                    viewPoint(
                        4.0,
                        1.15
                    )
                )
                .sub(
                    attachedAlmondOffset
                );


            enterState(
                "almondFirstApproach"
            );
        }

        return;
    }


    /* ALMOND FIRST APPROACH */

    if(
        sequenceState ===
        "almondFirstApproach"
    ){

        const raw =
            stateTime /
            durations.almondFirstApproach;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                almondLiftPosition,
                almondFirstBitePosition,
                progress
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                almondFirstBitePosition
            );


            spawnAlmondFirstBiteCrumbs();

            showAlmondBitten();


            enterState(
                "almondFirstHold"
            );
        }

        return;
    }


    /* ALMOND FIRST HOLD */

    if(
        sequenceState ===
        "almondFirstHold"
    ){

        if(
            stateTime >=
            durations.almondFirstHold
        ){

            almondRevealPosition
                .copy(
                    viewPoint(
                        6.4,
                        0.30
                    )
                )
                .sub(
                    attachedAlmondOffset
                );


            enterState(
                "almondReveal"
            );
        }

        return;
    }


    /* ALMOND REVEAL */

    if(
        sequenceState ===
        "almondReveal"
    ){

        const raw =
            stateTime /
            durations.almondReveal;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                almondFirstBitePosition,
                almondRevealPosition,
                progress
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                almondRevealPosition
            );

            enterState(
                "almondPause"
            );
        }

        return;
    }


    /* ALMOND PAUSE */

    if(
        sequenceState ===
        "almondPause"
    ){

        if(
            stateTime >=
            durations.almondPause
        ){

            almondSecondBitePosition
                .copy(
                    viewPoint(
                        3.75,
                        1.12
                    )
                )
                .sub(
                    attachedAlmondOffset
                );


            enterState(
                "almondSecondApproach"
            );
        }

        return;
    }


    /* ALMOND SECOND BITE */

    if(
        sequenceState ===
        "almondSecondApproach"
    ){

        const raw =
            stateTime /
            durations.almondSecondApproach;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                almondRevealPosition,
                almondSecondBitePosition,
                progress
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                almondSecondBitePosition
            );


            spawnAlmondSecondBiteCrumbs();

            hideAlmondTarget();


            enterState(
                "almondSecondHold"
            );
        }

        return;
    }


    if(
        sequenceState ===
        "almondSecondHold"
    ){

        if(
            stateTime >=
            durations.almondSecondHold
        ){

            const {
                forward,
                right,
                screenUp
            } =
                cameraBasis();


            almondExitPosition
                .copy(
                    viewPoint(
                        7,
                        -0.15
                    )
                )
                .add(
                    right.clone()
                        .multiplyScalar(
                            5.2
                        )
                )
                .add(
                    screenUp.clone()
                        .multiplyScalar(
                            0.5
                        )
                )
                .add(
                    forward.clone()
                        .multiplyScalar(
                            -0.5
                        )
                );


            enterState(
                "almondExit"
            );
        }

        return;
    }


    /* ALMOND EXIT */

    if(
        sequenceState ===
        "almondExit"
    ){

        const raw =
            stateTime /
            durations.almondExit;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                almondSecondBitePosition,
                almondExitPosition,
                progress
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                almondExitPosition
            );

            chopstickGroup.visible =
                false;

            enterState(
                "betweenFoods"
            );
        }

        return;
    }


    /* BETWEEN FOODS */

    if(
        sequenceState ===
        "betweenFoods"
    ){

        if(
            stateTime >=
            durations.betweenFoods
        ){

            steamVisible =
                true;

            steamGroup.visible =
                true;

            kickAllJelly(
                0.30
            );

            enterState(
                "servingSlide"
            );
        }

        return;
    }


    /* STEAMER SLIDE */

    if(
        sequenceState ===
        "servingSlide"
    ){

        const raw =
            stateTime /
            durations.servingSlide;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        plateStageGroup.position.x =
            THREE.MathUtils.lerp(
                PLATE_START_X,
                PLATE_FINAL_X,
                progress
            );


        steamerStageGroup.position.x =
            THREE.MathUtils.lerp(
                STEAMER_START_X,
                STEAMER_FINAL_X,
                progress
            );


        steamerStageGroup.position.z =
            THREE.MathUtils.lerp(
                STEAMER_START_Z,
                STEAMER_FINAL_Z,
                progress
            );


        updatePlateCookieInertia(
            progress,
            elapsedTime,
            false
        );


        const movementEnergy =
            Math.sin(
                clamp01(
                    raw
                ) *
                Math.PI
            ) *
            0.86;


        crystalCakes.forEach(
            function(
                cake,
                index
            ){

                cake
                    .userData
                    .jelly
                    .energy =
                    Math.max(
                        cake
                            .userData
                            .jelly
                            .energy,
                        movementEnergy *
                        (
                            0.92 +
                            index *
                            0.05
                        )
                    );
            }
        );


        if(
            raw >=
            1
        ){

            plateStageGroup.position.x =
                PLATE_FINAL_X;

            steamerStageGroup.position.x =
                STEAMER_FINAL_X;

            steamerStageGroup.position.z =
                STEAMER_FINAL_Z;


            kickAllJelly(
                0.80
            );


            enterState(
                "servingSettle"
            );
        }

        return;
    }


    /* SERVING SETTLE */

    if(
        sequenceState ===
        "servingSettle"
    ){

        updatePlateCookieInertia(
            1,
            elapsedTime,
            true
        );


        if(
            stateTime >=
            durations.servingSettle
        ){

            restoreLowerCookies();

            prepareCrystalGrip();


            chopstickGroup.visible =
                true;

            chopstickGroup.position.copy(
                crystalTurnStartPosition
            );

            chopstickGroup.quaternion.copy(
                crystalPreTurnQuaternion
            );

            setChopstickGap(
                crystalOpenGap,
                0.055
            );


            enterState(
                "crystalTurn"
            );
        }

        return;
    }


    /* CRYSTAL TURN + RAISE */

    if(
        sequenceState ===
        "crystalTurn"
    ){

        const raw =
            stateTime /
            durations.crystalTurn;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                crystalTurnStartPosition,
                crystalApproachStartPosition,
                progress
            );


        chopstickGroup.quaternion
            .slerpQuaternions(
                crystalPreTurnQuaternion,
                rearGripRaisedQuaternion,
                progress
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                crystalApproachStartPosition
            );

            chopstickGroup.quaternion.copy(
                rearGripRaisedQuaternion
            );


            enterState(
                "crystalApproach"
            );
        }

        return;
    }


    /* CRYSTAL APPROACH */

    if(
        sequenceState ===
        "crystalApproach"
    ){

        const raw =
            stateTime /
            durations.crystalApproach;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                crystalApproachStartPosition,
                crystalGripPosition,
                progress
            );


        chopstickGroup.quaternion.copy(
            rearGripRaisedQuaternion
        );


        setChopstickGap(
            crystalOpenGap,
            0.055
        );


        crystalTarget
            .userData
            .jelly
            .energy =
            Math.max(
                crystalTarget
                    .userData
                    .jelly
                    .energy,
                Math.sin(
                    clamp01(
                        raw
                    ) *
                    Math.PI
                ) *
                0.22
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                crystalGripPosition
            );

            kickJelly(
                crystalTarget,
                0.40
            );


            enterState(
                "crystalClose"
            );
        }

        return;
    }


    /* CRYSTAL CLOSE */

    if(
        sequenceState ===
        "crystalClose"
    ){

        const raw =
            stateTime /
            durations.crystalClose;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        setChopstickGap(
            THREE.MathUtils.lerp(
                crystalOpenGap,
                crystalGripGap,
                progress
            ),
            THREE.MathUtils.lerp(
                0.055,
                0.006,
                progress
            )
        );


        crystalTarget
            .userData
            .jelly
            .energy =
            Math.max(
                crystalTarget
                    .userData
                    .jelly
                    .energy,
                0.26 +
                progress *
                0.43
            );


        if(
            raw >=
            1
        ){

            setChopstickGap(
                crystalGripGap,
                0.006
            );

            attachCrystalCake();

            kickJelly(
                crystalTarget,
                0.96
            );


            enterState(
                "crystalGripSettle"
            );
        }

        return;
    }


    /* CRYSTAL GRIP SETTLE */

    if(
        sequenceState ===
        "crystalGripSettle"
    ){

        chopstickGroup.quaternion.copy(
            rearGripRaisedQuaternion
        );


        if(
            stateTime >=
            durations.crystalGripSettle
        ){

            enterState(
                "crystalLift"
            );
        }

        return;
    }


    /* CRYSTAL LIFT */

    if(
        sequenceState ===
        "crystalLift"
    ){

        const raw =
            stateTime /
            durations.crystalLift;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                crystalGripPosition,
                crystalLiftPosition,
                progress
            );


        chopstickGroup.quaternion
            .slerpQuaternions(
                rearGripRaisedQuaternion,
                rearGripCarryQuaternion,
                progress
            );


        crystalTarget
            .userData
            .jelly
            .energy =
            Math.max(
                crystalTarget
                    .userData
                    .jelly
                    .energy,
                Math.sin(
                    clamp01(
                        raw
                    ) *
                    Math.PI
                ) *
                0.74
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                crystalLiftPosition
            );

            chopstickGroup.quaternion.copy(
                rearGripCarryQuaternion
            );

            kickJelly(
                crystalTarget,
                0.82
            );


            enterState(
                "crystalMoveNear"
            );
        }

        return;
    }


    /* CRYSTAL MOVE NEAR */

    if(
        sequenceState ===
        "crystalMoveNear"
    ){

        const raw =
            stateTime /
            durations.crystalMoveNear;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                crystalLiftPosition,
                crystalNearPosition,
                progress
            );


        chopstickGroup.quaternion
            .slerpQuaternions(
                rearGripCarryQuaternion,
                rearGripLevelQuaternion,
                progress
            );


        crystalTarget
            .userData
            .jelly
            .energy =
            Math.max(
                crystalTarget
                    .userData
                    .jelly
                    .energy,
                Math.sin(
                    clamp01(
                        raw
                    ) *
                    Math.PI
                ) *
                0.58
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                crystalNearPosition
            );

            chopstickGroup.quaternion.copy(
                rearGripLevelQuaternion
            );


            crystalShakePosition.copy(
                crystalNearPosition
            );


            kickJelly(
                crystalTarget,
                1.08
            );


            enterState(
                "crystalShake"
            );
        }

        return;
    }


    /* LARGE CRYSTAL SHAKE */

    if(
        sequenceState ===
        "crystalShake"
    ){

        const raw =
            stateTime /
            durations.crystalShake;

        const progress =
            clamp01(
                raw
            );

        const envelope =
            Math.sin(
                progress *
                Math.PI
            );


        const {
            right,
            screenUp,
            forward
        } =
            cameraBasis();


        chopstickGroup.position
            .copy(
                crystalShakePosition
            )
            .add(
                right.clone()
                    .multiplyScalar(
                        Math.sin(
                            progress *
                            Math.PI *
                            6
                        ) *
                        0.38 *
                        envelope
                    )
            )
            .add(
                screenUp.clone()
                    .multiplyScalar(
                        Math.sin(
                            progress *
                            Math.PI *
                            4 +
                            0.75
                        ) *
                        0.17 *
                        envelope
                    )
            )
            .add(
                forward.clone()
                    .multiplyScalar(
                        Math.sin(
                            progress *
                            Math.PI *
                            5 +
                            1.20
                        ) *
                        0.12 *
                        envelope
                    )
            );


        const shakeEuler =
            new THREE.Euler(
                Math.sin(
                    progress *
                    Math.PI *
                    4
                ) *
                0.075 *
                envelope,
                Math.sin(
                    progress *
                    Math.PI *
                    5 +
                    0.4
                ) *
                0.19 *
                envelope,
                Math.sin(
                    progress *
                    Math.PI *
                    6 +
                    0.9
                ) *
                0.09 *
                envelope
            );


        const shakeQuaternion =
            new THREE.Quaternion()
                .setFromEuler(
                    shakeEuler
                );


        chopstickGroup.quaternion
            .copy(
                rearGripLevelQuaternion
            )
            .multiply(
                shakeQuaternion
            );


        crystalTarget
            .userData
            .jelly
            .energy =
            Math.max(
                crystalTarget
                    .userData
                    .jelly
                    .energy,
                0.92 *
                envelope +
                0.32
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                crystalShakePosition
            );

            chopstickGroup.quaternion.copy(
                rearGripLevelQuaternion
            );

            kickJelly(
                crystalTarget,
                0.70
            );


            prepareCrystalFacingCamera();


            enterState(
                "crystalFace"
            );
        }

        return;
    }


    /* FACE BITE AREA TOWARD CAMERA */

    if(
        sequenceState ===
        "crystalFace"
    ){

        const raw =
            stateTime /
            durations.crystalFace;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        crystalTarget
            .userData
            .jelly
            .baseQuaternion
            .slerpQuaternions(
                crystalFaceStartQuaternion,
                crystalFaceTargetQuaternion,
                progress
            );


        if(
            raw >=
            1
        ){

            crystalTarget
                .userData
                .jelly
                .baseQuaternion
                .copy(
                    crystalFaceTargetQuaternion
                );


            enterState(
                "crystalFirstApproach"
            );
        }

        return;
    }


    /* CRYSTAL FIRST BITE */

    if(
        sequenceState ===
        "crystalFirstApproach"
    ){

        const raw =
            stateTime /
            durations.crystalFirstApproach;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                crystalShakePosition,
                crystalFirstBitePosition,
                progress
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                crystalFirstBitePosition
            );


            showCrystalBitten(
                crystalTarget
            );


            kickJelly(
                crystalTarget,
                1.18
            );


            enterState(
                "crystalFirstSquash"
            );
        }

        return;
    }


    /* FIRST BITE SQUASH */

    if(
        sequenceState ===
        "crystalFirstSquash"
    ){

        const raw =
            stateTime /
            durations.crystalFirstSquash;

        const progress =
            clamp01(
                raw
            );


        crystalTarget
            .userData
            .jelly
            .biteCompression =
            Math.sin(
                progress *
                Math.PI
            );


        crystalTarget
            .userData
            .jelly
            .energy =
            Math.max(
                crystalTarget
                    .userData
                    .jelly
                    .energy,
                0.95
            );


        if(
            raw >=
            1
        ){

            crystalTarget
                .userData
                .jelly
                .biteCompression =
                0;


            enterState(
                "crystalFirstReveal"
            );
        }

        return;
    }


    /* FIRST BITE REVEAL */

    if(
        sequenceState ===
        "crystalFirstReveal"
    ){

        const raw =
            stateTime /
            durations.crystalFirstReveal;

        const progress =
            clamp01(
                raw
            );


        const backProgress =
            THREE.MathUtils.clamp(
                easeOutBack(
                    progress
                ),
                0,
                1.08
            );


        chopstickGroup.position
            .lerpVectors(
                crystalFirstBitePosition,
                crystalFirstRevealPosition,
                backProgress
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                crystalFirstRevealPosition
            );


            kickJelly(
                crystalTarget,
                0.45
            );


            enterState(
                "crystalFirstHold"
            );
        }

        return;
    }


    if(
        sequenceState ===
        "crystalFirstHold"
    ){

        if(
            stateTime >=
            durations.crystalFirstHold
        ){

            enterState(
                "crystalSecondApproach"
            );
        }

        return;
    }


    /* SECOND BITE APPROACH */

    if(
        sequenceState ===
        "crystalSecondApproach"
    ){

        const raw =
            stateTime /
            durations.crystalSecondApproach;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                crystalFirstRevealPosition,
                crystalSecondBitePosition,
                progress
            );


        crystalTarget
            .userData
            .jelly
            .baseQuaternion
            .copy(
                crystalFaceTargetQuaternion
            );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                crystalSecondBitePosition
            );


            kickJelly(
                crystalTarget,
                1.05
            );


            enterState(
                "crystalSecondSquash"
            );
        }

        return;
    }


    /* SECOND BITE SQUASH */

    if(
        sequenceState ===
        "crystalSecondSquash"
    ){

        const raw =
            stateTime /
            durations.crystalSecondSquash;

        const progress =
            clamp01(
                raw
            );


        crystalTarget
            .userData
            .jelly
            .biteCompression =
            Math.sin(
                progress *
                Math.PI
            );


        crystalTarget
            .userData
            .jelly
            .energy =
            Math.max(
                crystalTarget
                    .userData
                    .jelly
                    .energy,
                1.0
            );


        if(
            raw >=
            1
        ){

            crystalTarget
                .userData
                .jelly
                .biteCompression =
                0;


            hideCrystalCake(
                crystalTarget
            );


            enterState(
                "crystalSecondHold"
            );
        }

        return;
    }


    if(
        sequenceState ===
        "crystalSecondHold"
    ){

        if(
            stateTime >=
            durations.crystalSecondHold
        ){

            const {
                forward,
                right,
                screenUp
            } =
                cameraBasis();


            crystalExitPosition
                .copy(
                    viewPoint(
                        6.55,
                        -0.08,
                        0.25
                    )
                )
                .add(
                    right.clone()
                        .multiplyScalar(
                            5
                        )
                )
                .add(
                    screenUp.clone()
                        .multiplyScalar(
                            0.62
                        )
                )
                .add(
                    forward.clone()
                        .multiplyScalar(
                            -0.35
                        )
                );


            enterState(
                "crystalExit"
            );
        }

        return;
    }


    /* EMPTY CHOPSTICKS EXIT */

    if(
        sequenceState ===
        "crystalExit"
    ){

        const raw =
            stateTime /
            durations.crystalExit;

        const progress =
            easeInOutCubic(
                clamp01(
                    raw
                )
            );


        chopstickGroup.position
            .lerpVectors(
                crystalSecondBitePosition,
                crystalExitPosition,
                progress
            );


        chopstickGroup.quaternion.copy(
            rearGripLevelQuaternion
        );


        setChopstickGap(
            THREE.MathUtils.lerp(
                crystalGripGap,
                crystalOpenGap *
                0.92,
                progress
            ),
            THREE.MathUtils.lerp(
                0.006,
                0.035,
                progress
            )
        );


        if(
            raw >=
            1
        ){

            chopstickGroup.position.copy(
                crystalExitPosition
            );


            isPlaying =
                false;

            isPaused =
                false;

            sequenceState =
                "complete";


            /*
             * After completion camera interaction stays enabled.
             */

            controls.enabled =
                true;


            syncButtons();
        }

        return;
    }
}


/* ============================================================
   PASTRY SHADER UPDATE
   ============================================================ */

function updatePastryShaders(
    elapsedTime
){

    let motionStrength =
        0;


    if(
        isPlaying &&
        !isPaused &&
        [
            "almondLift",
            "almondFirstApproach",
            "almondReveal",
            "almondSecondApproach"
        ].includes(
            sequenceState
        )
    ){

        motionStrength =
            0.35;
    }


    else if(
        isPlaying &&
        !isPaused &&
        [
            "almondApproach",
            "almondClose"
        ].includes(
            sequenceState
        )
    ){

        motionStrength =
            0.10;
    }


    for(
        const uniforms
        of pastryUniformSets
    ){

        uniforms.uTime.value =
            elapsedTime;

        uniforms.uTextureEnabled.value =
            1;
    }


    const pairs = [

        [
            staticCookieMaterial,
            0
        ],

        [
            targetWholeMaterial,
            motionStrength
        ],

        [
            targetShellMaterial,
            motionStrength
        ],

        [
            targetCoreMaterial,
            motionStrength *
            0.4
        ]
    ];


    for(
        const [
            material,
            value
        ]
        of pairs
    ){

        if(
            material?.userData?.uniforms
                ?.uMotionStrength
        ){

            material
                .userData
                .uniforms
                .uMotionStrength
                .value =
                value;
        }
    }
}


/* ============================================================
   BUILD SCENE
   ============================================================ */

async function buildScene(){

    try{

        const [
            wholeGeometry,
            shellGeometry,
            coreGeometry,

            steamerGeometry,

            crystalWholeBodyGeometry,
            crystalWholePetalGeometry,

            crystalBittenBodyGeometry,
            crystalBittenPetalGeometry,

            shellSurfaceColor,
            shellSurfaceRoughness,

            shellRidgesColor,
            shellRidgesRoughness,

            crumbColor,
            crumbRoughness,

            fillingColor,
            fillingRoughness
        ] =
            await Promise.all([

                loadSTL(
                    modelPaths.almondWhole,
                    "almond_whole_body.stl"
                ),

                loadSTL(
                    modelPaths.almondShell,
                    "almond_bitten_shell.stl"
                ),

                loadSTL(
                    modelPaths.almondCore,
                    "almond_bitten_core.stl"
                ),

                loadSTL(
                    modelPaths.steamer,
                    "bamboo_steamer.stl"
                ),

                loadSTL(
                    modelPaths.crystalWholeBody,
                    "crystal_cake_whole_body.stl"
                ),

                loadSTL(
                    modelPaths.crystalWholePetals,
                    "crystal_cake_whole_petals.stl"
                ),

                loadSTL(
                    modelPaths.crystalBittenBody,
                    "crystal_cake_bitten_body.stl"
                ),

                loadSTL(
                    modelPaths.crystalBittenPetals,
                    "crystal_cake_bitten_petals.stl"
                ),

                loadTexture(
                    texturePaths.shellSurfaceColor
                ),

                loadTexture(
                    texturePaths.shellSurfaceRoughness
                ),

                loadTexture(
                    texturePaths.shellRidgesColor
                ),

                loadTexture(
                    texturePaths.shellRidgesRoughness
                ),

                loadTexture(
                    texturePaths.crumbColor
                ),

                loadTexture(
                    texturePaths.crumbRoughness
                ),

                loadTexture(
                    texturePaths.fillingColor
                ),

                loadTexture(
                    texturePaths.fillingRoughness
                )
            ]);


        wholeGeometry
            .boundingBox
            .getCenter(
                sharedCenter
            );


        wholeGeometry
            .boundingBox
            .getSize(
                sharedSize
            );


        const sourceDiameter =
            Math.max(
                sharedSize.x,
                sharedSize.y
            );


        sharedScale =
            2.9 /
            sourceDiameter;


        cookieDiameter =
            sourceDiameter *
            sharedScale;


        cookieHeight =
            sharedSize.z *
            sharedScale;


        const softenedWholeGeometry =
            softenPastryGeometry(
                wholeGeometry,
                sharedCenter,
                sharedSize,
                {
                    outerStart:0.84,
                    capStart:0.56,
                    radialRoundness:0.070,
                    verticalRoundness:0.095,
                    sidePuff:0.012,
                    creaseAngle:
                        THREE.MathUtils
                            .degToRad(
                                58
                            )
                }
            );


        const softenedShellGeometry =
            softenPastryGeometry(
                shellGeometry,
                sharedCenter,
                sharedSize,
                {
                    outerStart:0.84,
                    capStart:0.56,
                    radialRoundness:0.066,
                    verticalRoundness:0.090,
                    sidePuff:0.010,
                    creaseAngle:
                        THREE.MathUtils
                            .degToRad(
                                56
                            )
                }
            );


        const softenedCoreGeometry =
            BufferGeometryUtils
                .toCreasedNormals(
                    coreGeometry.clone(),
                    THREE.MathUtils
                        .degToRad(
                            52
                        )
                );


        softenedCoreGeometry.computeBoundingBox();

        softenedCoreGeometry.computeBoundingSphere();


        const maps = {
            shellSurfaceColor,
            shellSurfaceRoughness,
            shellRidgesColor,
            shellRidgesRoughness,
            crumbColor,
            crumbRoughness,
            fillingColor,
            fillingRoughness
        };


        const shellTextureScale =
            4.8 /
            sourceDiameter;

        const coreTextureScale =
            6.4 /
            sourceDiameter;


        staticCookieMaterial =
            createPastryMaterial({
                cacheKey:"static",
                flatColor:0xd3a061,
                roughness:0.84,
                materialType:0,
                textureScale:
                    shellTextureScale,
                maps
            });


        targetWholeMaterial =
            createPastryMaterial({
                cacheKey:"whole",
                flatColor:0xd3a061,
                roughness:0.84,
                materialType:0,
                textureScale:
                    shellTextureScale,
                maps
            });


        targetShellMaterial =
            createPastryMaterial({
                cacheKey:"shell",
                flatColor:0xc97a39,
                roughness:0.86,
                materialType:0,
                textureScale:
                    shellTextureScale,
                maps
            });


        targetCoreMaterial =
            createPastryMaterial({
                cacheKey:"core",
                flatColor:0xf1d0a6,
                roughness:0.44,
                materialType:1,
                textureScale:
                    coreTextureScale,
                coreFillingBlend:
                    0.64,
                maps
            });


        /* Three almond pastries */

        lowerLeftCookie =
            createStaticCookie(
                softenedWholeGeometry
            );

        lowerRightCookie =
            createStaticCookie(
                softenedWholeGeometry
            );

        targetCookie =
            createTargetCookie(
                softenedWholeGeometry,
                softenedShellGeometry,
                softenedCoreGeometry
            );


        const plateTopY =
            0.50;


        const lowerOffset =
            (
                cookieDiameter +
                0.14
            ) /
            2;


        const lowerCenterY =
            plateTopY +
            cookieHeight *
            0.50;


        const upperCenterY =
            plateTopY +
            cookieHeight *
            1.50 +
            0.055;


        lowerLeftCookie.position.set(
            -lowerOffset,
            lowerCenterY,
            0.34
        );

        lowerRightCookie.position.set(
            lowerOffset,
            lowerCenterY,
            0.34
        );

        targetCookie.position.set(
            0,
            upperCenterY,
            -0.26
        );


        lowerLeftCookie.rotation.y =
            -0.13;

        lowerRightCookie.rotation.y =
            0.11;


        lowerLeftHome.copy(
            lowerLeftCookie.position
        );

        lowerRightHome.copy(
            lowerRightCookie.position
        );

        targetCookieHome.copy(
            targetCookie.position
        );


        plateStageGroup.add(
            lowerLeftCookie,
            lowerRightCookie,
            targetCookie
        );


        const leftCookieShadow =
            createContactShadow(
                3.35,
                2.75,
                0.14
            );

        const rightCookieShadow =
            createContactShadow(
                3.35,
                2.75,
                0.14
            );


        leftCookieShadow.position.set(
            lowerLeftHome.x,
            0.535,
            lowerLeftHome.z
        );

        rightCookieShadow.position.set(
            lowerRightHome.x,
            0.535,
            lowerRightHome.z
        );


        plateStageGroup.add(
            leftCookieShadow,
            rightCookieShadow
        );


        createCrumbPool();

        createChopsticks();

        prepareAlmondPaths();


        /* Bamboo steamer */

        steamerGeometry.computeBoundingBox();


        const steamerCenter =
            new THREE.Vector3();

        const steamerSize =
            new THREE.Vector3();


        steamerGeometry
            .boundingBox
            .getCenter(
                steamerCenter
            );

        steamerGeometry
            .boundingBox
            .getSize(
                steamerSize
            );


        steamerHeight =
            steamerSize.z *
            sharedScale;


        steamerStageGroup =
            new THREE.Group();

        scene.add(
            steamerStageGroup
        );


        const steamerRoot =
            new THREE.Group();

        steamerRoot.rotation.x =
            -Math.PI /
            2;

        steamerRoot.scale.setScalar(
            sharedScale
        );


        const steamerMesh =
            new THREE.Mesh(
                steamerGeometry,
                bambooMaterial
            );


        steamerMesh.position.set(
            -steamerCenter.x,
            -steamerCenter.y,
            -steamerCenter.z
        );

        steamerMesh.castShadow =
            true;

        steamerMesh.receiveShadow =
            true;


        steamerRoot.add(
            steamerMesh
        );

        steamerStageGroup.add(
            steamerRoot
        );


        steamerStageGroup.position.set(
            STEAMER_START_X,
            steamerHeight *
            0.5 +
            0.03,
            STEAMER_START_Z
        );


        const steamerShadow =
            createContactShadow(
                8,
                7.7,
                0.20
            );


        steamerShadow.position.set(
            0,
            -steamerHeight *
            0.5 +
            0.02,
            0
        );


        steamerStageGroup.add(
            steamerShadow
        );


        /* Crystal cakes */

        crystalWholeBodyGeometry.computeBoundingBox();


        const crystalCenter =
            new THREE.Vector3();

        const crystalSize =
            new THREE.Vector3();


        crystalWholeBodyGeometry
            .boundingBox
            .getCenter(
                crystalCenter
            );

        crystalWholeBodyGeometry
            .boundingBox
            .getSize(
                crystalSize
            );


        crystalHeight =
            crystalSize.z *
            sharedScale;


        const steamerFloorSourceZ =
            5.7;


        const cakeLocalY =
            (
                steamerFloorSourceZ -
                steamerCenter.z
            ) *
            sharedScale +
            crystalHeight *
            0.5 +
            0.03;


        crystalTarget =
            createCrystalCake(
                crystalWholeBodyGeometry,
                crystalWholePetalGeometry,
                crystalBittenBodyGeometry,
                crystalBittenPetalGeometry,
                crystalCenter,
                crystalSize,
                0.35
            );


        const cakeB =
            createCrystalCake(
                crystalWholeBodyGeometry,
                crystalWholePetalGeometry,
                crystalBittenBodyGeometry,
                crystalBittenPetalGeometry,
                crystalCenter,
                crystalSize,
                2.15
            );


        const cakeC =
            createCrystalCake(
                crystalWholeBodyGeometry,
                crystalWholePetalGeometry,
                crystalBittenBodyGeometry,
                crystalBittenPetalGeometry,
                crystalCenter,
                crystalSize,
                4.10
            );


        crystalTarget.position.set(
            0,
            cakeLocalY,
            -0.88
        );

        cakeB.position.set(
            -1.55,
            cakeLocalY,
            1.05
        );

        cakeC.position.set(
            1.55,
            cakeLocalY,
            1.05
        );


        crystalTarget.rotation.y =
            0.02;

        cakeB.rotation.y =
            -0.14;

        cakeC.rotation.y =
            0.13;


        for(
            const cake
            of crystalCakes
        ){

            cake
                .userData
                .jelly
                .homePosition
                .copy(
                    cake.position
                );

            cake
                .userData
                .jelly
                .homeQuaternion
                .copy(
                    cake.quaternion
                );

            cake
                .userData
                .jelly
                .baseQuaternion
                .copy(
                    cake.quaternion
                );


            steamerStageGroup.add(
                cake
            );
        }


        steamBaseY =
            steamerHeight *
            0.54 +
            0.12;


        createSteamSystem();


        ready =
            true;


        resetSequence();

        syncButtons();
    }


    catch(
        error
    ){

        console.error(
            "Initialization error:",
            error
        );


        ready =
            false;

        syncButtons();
    }
}


/* ============================================================
   BUTTON EVENTS
   ============================================================ */

playButton.addEventListener(
    "click",
    playOrResume
);


pauseButton.addEventListener(
    "click",
    pauseSequence
);


/* ============================================================
   BUILD
   ============================================================ */

buildScene();


/* ============================================================
   RENDER LOOP
   ============================================================ */

renderer.setAnimationLoop(
    function(){

        const rawDelta =
            Math.min(
                clock.getDelta(),
                0.05
            );


        /*
         * This controls ONLY simulation time.
         *
         * Pause = 0 delta for:
         * - timeline
         * - jelly
         * - steam
         * - crumbs
         * - shaders
         *
         * OrbitControls still run below.
         */

        const simulationDelta =
            isPaused
                ? 0
                : rawDelta;


        if(
            !isPaused
        ){

            sceneTime +=
                rawDelta;
        }


        if(
            ready
        ){

            if(
                isPlaying &&
                !isPaused
            ){

                updateSequence(
                    rawDelta,
                    sceneTime
                );
            }


            updateCrumbs(
                simulationDelta
            );


            updateJelly(
                simulationDelta,
                sceneTime
            );


            updateSteam(
                simulationDelta,
                sceneTime
            );


            updatePastryShaders(
                sceneTime
            );
        }


        /*
         * IMPORTANT:
         *
         * controls.update() is NEVER paused.
         *
         * The user can therefore rotate, zoom and pan
         * while the animation is frozen.
         */

        controls.update();


        renderer.render(
            scene,
            camera
        );
    }
);


/* ============================================================
   RESIZE
   ============================================================ */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );
    }
);

</script>
