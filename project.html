function createContactShadowTexture(){

    const size =
        256;

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        size;

    canvas.height =
        size;

    const context =
        canvas.getContext(
            "2d"
        );

    const gradient =
        context.createRadialGradient(
            size * 0.5,
            size * 0.5,
            0,
            size * 0.5,
            size * 0.5,
            size * 0.5
        );

    gradient.addColorStop(
        0,
        "rgba(20,8,3,0.72)"
    );

    gradient.addColorStop(
        0.35,
        "rgba(20,8,3,0.38)"
    );

    gradient.addColorStop(
        0.72,
        "rgba(20,8,3,0.10)"
    );

    gradient.addColorStop(
        1,
        "rgba(20,8,3,0)"
    );

    context.fillStyle =
        gradient;

    context.fillRect(
        0,
        0,
        size,
        size
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.NoColorSpace;

    return texture;
}


const contactShadowTexture =

function createContactShadow(

){

            toneMapped:

            new THREE.PlaneGeometry(
                width,
                depth
            ),
            material
        );

    mesh.rotation.x =
        -Math.PI /
        2;

    return mesh;
}

function loadSTL(
    path,
    label
){

    return new Promise(
        (
            resolve,
            reject
        ) => {

            stlLoader.load(

                path,

                function(
                    geometry
                ){

                    geometry.computeVertexNormals();

                    geometry.computeBoundingBox();

                    if(
                        !geometry.boundingBox
                    ){

                        reject(
                            new Error(
                                label +
                                " has no bounding box."
                            )
                        );

                        return;
                    }

                    resolve(
                        geometry
                    );
                },

                undefined,

                function(
                    error
                ){

                    reject(
                        new Error(
                            "Failed to load " +
                            path +
                            ": " +
                            String(
                                error
                            )
                        )
                    );
                }
            );
        }
    );
}


async function loadTexture(
    path
){

    const texture =
        await textureLoader.loadAsync(
            path
        );

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.magFilter =
        THREE.LinearFilter;

    texture.anisotropy =
        Math.min(
            8,
            renderer
                .capabilities
                .getMaxAnisotropy()
        );

    texture.colorSpace =
        THREE.NoColorSpace;

    texture.needsUpdate =
        true;

    return texture;
}

/* ============================================================
   SOFT ALMOND GEOMETRY
   ============================================================ */

function smoothstepValue(
    edge0,
    edge1,
    value
){

    const t =
        THREE.MathUtils.clamp(
            (
                value -
                edge0
            ) /
            (
                edge1 -
                edge0
            ),
            0,
            1
        );

    return (
        t *
        t *
        (
            3 -
            2 *
            t
        )
    );
}


function softenPastryGeometry(
    sourceGeometry,
    modelCenter,
    modelSize,
    options = {}
){

    const geometry =
        sourceGeometry.clone();

    const position =
        geometry.getAttribute(
            "position"
        );

    const radius =
        Math.max(
            modelSize.x,
            modelSize.y
        ) *
        0.5;

    const halfHeight =
        modelSize.z *
        0.5;

    const outerStart =
        options.outerStart ??
        0.84;

    const capStart =
        options.capStart ??
        0.56;

    const radialRoundness =
        options.radialRoundness ??
        0.070;

    const verticalRoundness =
        options.verticalRoundness ??
        0.095;

    const sidePuff =
        options.sidePuff ??
        0.012;


    for(
        let index = 0;
        index < position.count;
        index += 1
    ){

        let x =
            position.getX(
                index
            ) -
            modelCenter.x;

        let y =
            position.getY(
                index
            ) -
            modelCenter.y;

        let z =
            position.getZ(
                index
            ) -
            modelCenter.z;


        const radialNormalized =
            THREE.MathUtils.clamp(
                Math.hypot(
                    x,
                    y
                ) /
                Math.max(
                    radius,
                    0.000001
                ),
                0,
                1.25
            );


        const heightNormalized =
            THREE.MathUtils.clamp(
                Math.abs(
                    z
                ) /
                Math.max(
                    halfHeight,
                    0.000001
                ),
                0,
                1.25
            );


        const outerBand =
            smoothstepValue(
                outerStart,
                1,
                radialNormalized
            );

        const capBand =
            smoothstepValue(
                capStart,
                1,
                heightNormalized
            );

        const cornerBand =
            outerBand *
            capBand;

        const middleBand =
            outerBand *
            (
                1 -
                smoothstepValue(
                    0.35,
                    0.90,
                    heightNormalized
                )
            );


        const radialFactor =
            1 -
            radialRoundness *
            cornerBand +
            sidePuff *
            middleBand;


        x *=
            radialFactor;

        y *=
            radialFactor;

        z *=
            1 -
            verticalRoundness *
            cornerBand;


        position.setXYZ(
            index,
            x +
            modelCenter.x,
            y +
            modelCenter.y,
            z +
            modelCenter.z
        );
    }


    position.needsUpdate =
        true;

    geometry.computeBoundingBox();

    geometry.computeBoundingSphere();


    const softenedGeometry =
        BufferGeometryUtils
            .toCreasedNormals(
                geometry,
                options.creaseAngle ??
                THREE.MathUtils.degToRad(
                    58
                )
            );


    softenedGeometry.computeBoundingBox();

    softenedGeometry.computeBoundingSphere();


    return softenedGeometry;
}


/* ============================================================

   ============================================================ */

function createPastryMaterial(
    options
){

    const material =
        new THREE.MeshStandardMaterial({
            color:
                options.flatColor,
            roughness:
                options.roughness,
            metalness:
                0
        });


    const uniforms = {

        uTime:{
            value:0
        },

        uMotionStrength:{
            value:0
        },

        uTextureEnabled:{
            value:1
        },

        uMaterialType:{
            value:
                options.materialType
        },

        uTextureScale:{
            value:
                options.textureScale
        },

        uCoreFillingBlend:{
            value:
                options.coreFillingBlend ??
                0.64
        },

        uShellSurfaceColor:{
            value:
                options.maps
                    .shellSurfaceColor
        },

        uShellSurfaceRoughness:{
            value:
                options.maps
                    .shellSurfaceRoughness
        },

        uShellRidgesColor:{
            value:
                options.maps
                    .shellRidgesColor
        },

        uShellRidgesRoughness:{
            value:
                options.maps
                    .shellRidgesRoughness
        },

        uCrumbColor:{
            value:
                options.maps
                    .crumbColor
        },

        uCrumbRoughness:{
            value:
                options.maps
                    .crumbRoughness
        },

        uFillingColor:{
            value:
                options.maps
                    .fillingColor
        },

        uFillingRoughness:{
            value:
                options.maps
                    .fillingRoughness
        }
    };


    material.userData.uniforms =
        uniforms;

    pastryUniformSets.push(
        uniforms
    );


    material.onBeforeCompile =
        function(
            shader
        ){

            Object.assign(
                shader.uniforms,
                uniforms
            );


            shader.vertexShader =
                shader.vertexShader.replace(

                    "#include <common>",

                    `#include <common>
                    uniform float uTime;
                    uniform float uMotionStrength;
                    varying vec3 vObjectPosition;
                    varying vec3 vObjectNormal;`
                );


            shader.vertexShader =
                shader.vertexShader.replace(

                    "#include <beginnormal_vertex>",

                    `#include <beginnormal_vertex>
                    vObjectNormal =
                        normalize(
                            objectNormal
                        );`
                );


            shader.vertexShader =
                shader.vertexShader.replace(

                    "#include <begin_vertex>",

                    `#include <begin_vertex>

                    float pastryWave =
                        sin(
                            uTime *
                            10.0 +
                            position.x *
                            0.15 +
                            position.y *
                            0.11
                        ) *
                        cos(
                            uTime *
                            7.0 +
                            position.z *
                            0.18
                        );

                    transformed +=
                        objectNormal *
                        pastryWave *
                        0.045 *
                        uMotionStrength;

                    vObjectPosition =
                        transformed;`
                );


            shader.fragmentShader =
                shader.fragmentShader.replace(

                    "#include <common>",

                    `#include <common>

                    uniform float uTextureEnabled;
                    uniform float uMaterialType;
                    uniform float uTextureScale;
                    uniform float uCoreFillingBlend;

                    uniform sampler2D uShellSurfaceColor;
                    uniform sampler2D uShellSurfaceRoughness;

                    uniform sampler2D uShellRidgesColor;
                    uniform sampler2D uShellRidgesRoughness;

                    uniform sampler2D uCrumbColor;
                    uniform sampler2D uCrumbRoughness;

                    uniform sampler2D uFillingColor;
                    uniform sampler2D uFillingRoughness;

                    varying vec3 vObjectPosition;
                    varying vec3 vObjectNormal;

                    float customRoughness =
                        0.8;


                    float hash31(
                        vec3 p
                    ){

                        p =
                            fract(
                                p *
                                0.1031
                            );

                        p +=
                            dot(
                                p,
                                p.yzx +
                                33.33
                            );

                        return fract(
                            (
                                p.x +
                                p.y
                            ) *
                            p.z
                        );
                    }


                    float noise3(
                        vec3 p
                    ){

                        vec3 i =
                            floor(
                                p
                            );

                        vec3 f =
                            fract(
                                p
                            );

                        f =
                            f *
                            f *
                            (
                                3.0 -
                                2.0 *
                                f
                            );

                        float a =
                            hash31(
                                i
                            );

                        float b =
                            hash31(
                                i +
                                vec3(
                                    1,
                                    0,
                                    0
                                )
                            );

                        float c =
                            hash31(
                                i +
                                vec3(
                                    0,
                                    1,
                                    0
                                )
                            );

                        float d =
                            hash31(
                                i +
                                vec3(
                                    1,
                                    1,
                                    0
                                )
                            );

                        float e =
                            hash31(
                                i +
                                vec3(
                                    0,
                                    0,
                                    1
                                )
                            );

                        float f1 =
                            hash31(
                                i +
                                vec3(
                                    1,
                                    0,
                                    1
                                )
                            );

                        float g =
                            hash31(
                                i +
                                vec3(
                                    0,
                                    1,
                                    1
                                )
                            );

                        float h =
                            hash31(
                                i +
                                vec3(
                                    1
                                )
                            );

                        return mix(
                            mix(
                                mix(
                                    a,
                                    b,
                                    f.x
                                ),
                                mix(
                                    c,
                                    d,
                                    f.x
                                ),
                                f.y
                            ),
                            mix(
                                mix(
                                    e,
                                    f1,
                                    f.x
                                ),
                                mix(
                                    g,
                                    h,
                                    f.x
                                ),
                                f.y
                            ),
                            f.z
                        );
                    }


                    vec3 saturateColor(
                        vec3 colorValue,
                        float amount
                    ){

                        float luminance =
                            dot(
                                colorValue,
                                vec3(
                                    0.299,
                                    0.587,
                                    0.114
                                )
                            );

                        return mix(
                            vec3(
                                luminance
                            ),
                            colorValue,
                            amount
                        );
                    }


                    vec3 adjustContrast(
                        vec3 colorValue,
                        float contrastValue
                    ){

                        return (
                            colorValue -
                            0.5
                        ) *
                        contrastValue +
                        0.5;
                    }


                    vec3 getTriWeights(
                        vec3 normalValue
                    ){

                        vec3 weights =
                            pow(
                                abs(
                                    normalize(
                                        normalValue
                                    )
                                ),
                                vec3(
                                    5.0
                                )
                            );

                        weights /=
                            max(
                                weights.x +
                                weights.y +
                                weights.z,
                                0.0001
                            );

                        return weights;
                    }


                    vec3 sampleTriColor(
                        sampler2D textureMap,
                        vec3 positionValue,
                        vec3 normalValue,
                        float scaleValue
                    ){

                        vec3 weights =
                            getTriWeights(
                                normalValue
                            );

                        vec3 xSample =
                            texture2D(
                                textureMap,
                                positionValue.yz *
                                scaleValue
                            ).rgb;

                        vec3 ySample =
                            texture2D(
                                textureMap,
                                positionValue.xz *
                                scaleValue
                            ).rgb;

                        vec3 zSample =
                            texture2D(
                                textureMap,
                                positionValue.xy *
                                scaleValue
                            ).rgb;

                        xSample =
                            pow(
                                max(
                                    xSample,
                                    vec3(0)
                                ),
                                vec3(
                                    2.2
                                )
                            );

                        ySample =
                            pow(
                                max(
                                    ySample,
                                    vec3(0)
                                ),
                                vec3(
                                    2.2
                                )
                            );

                        zSample =
                            pow(
                                max(
                                    zSample,
                                    vec3(0)
                                ),
                                vec3(
                                    2.2
                                )
                            );

                        return
                            xSample *
                            weights.x +
                            ySample *
                            weights.y +
                            zSample *
                            weights.z;
                    }


                    float sampleTriValue(
                        sampler2D textureMap,
                        vec3 positionValue,
                        vec3 normalValue,
                        float scaleValue
                    ){

                        vec3 weights =
                            getTriWeights(
                                normalValue
                            );

                        return
                            texture2D(
                                textureMap,
                                positionValue.yz *
                                scaleValue
                            ).r *
                            weights.x +

                            texture2D(
                                textureMap,
                                positionValue.xz *
                                scaleValue
                            ).r *
                            weights.y +

                            texture2D(
                                textureMap,
                                positionValue.xy *
                                scaleValue
                            ).r *
                            weights.z;
                    }`
                );


            shader.fragmentShader =
                shader.fragmentShader.replace(

                    "#include <color_fragment>",

                    `#include <color_fragment>

                    vec3 normalValue =
                        normalize(
                            vObjectNormal
                        );

                    vec3 textureColor =
                        diffuseColor.rgb;

                    float textureRoughness =
                        0.8;


                    if(
                        uMaterialType <
                        0.5
                    ){

                        float topWeight =
                            smoothstep(
                                0.34,
                                0.82,
                                abs(
                                    normalValue.z
                                )
                            );

                        vec3 surfaceColor =
                            sampleTriColor(
                                uShellSurfaceColor,
                                vObjectPosition,
                                normalValue,
                                uTextureScale
                            );

                        vec3 ridgeColor =
                            sampleTriColor(
                                uShellRidgesColor,
                                vObjectPosition,
                                normalValue,
                                uTextureScale
                            );

                        float surfaceRoughness =
                            sampleTriValue(
                                uShellSurfaceRoughness,
                                vObjectPosition,
                                normalValue,
                                uTextureScale
                            );

                        float ridgeRoughness =
                            sampleTriValue(
                                uShellRidgesRoughness,
                                vObjectPosition,
                                normalValue,
                                uTextureScale
                            );

                        textureColor =
                            mix(
                                ridgeColor,
                                surfaceColor,
                                topWeight
                            );

                        textureRoughness =
                            mix(
                                ridgeRoughness,
                                surfaceRoughness,
                                topWeight
                            );

                        textureColor *=
                            0.90 +
                            noise3(
                                vObjectPosition *
                                0.19
                            ) *
                            0.18;

                        textureColor *=
                            0.96 +
                            noise3(
                                vObjectPosition *
                                0.75
                            ) *
                            0.06;

                        textureColor *=
                            1.0 -
                            (
                                1.0 -
                                topWeight
                            ) *
                            0.12;

                        textureColor =
                            saturateColor(
                                textureColor,
                                1.20
                            );

                        textureColor =
                            adjustContrast(
                                textureColor,
                                1.15
                            );

                        textureColor.r *=
                            1.03;

                        textureColor.g *=
                            1.01;

                        textureRoughness =
                            clamp(
                                0.72 +
                                textureRoughness *
                                0.22,
                                0.66,
                                0.98
                            );
                    }

                    else{

                        vec3 crumbColor =
                            sampleTriColor(
                                uCrumbColor,
                                vObjectPosition,
                                normalValue,
                                uTextureScale *
                                1.18
                            );

                        vec3 fillingColor =
                            sampleTriColor(
                                uFillingColor,
                                vObjectPosition,
                                normalValue,
                                uTextureScale
                            );

                        float crumbRoughness =
                            sampleTriValue(
                                uCrumbRoughness,
                                vObjectPosition,
                                normalValue,
                                uTextureScale *
                                1.18
                            );

                        float fillingRoughness =
                            sampleTriValue(
                                uFillingRoughness,
                                vObjectPosition,
                                normalValue,
                                uTextureScale
                            );

                        float fillingMask =
                            clamp(
                                uCoreFillingBlend +
                                (
                                    noise3(
                                        vObjectPosition *
                                        0.18
                                    ) -
                                    0.5
                                ) *
                                0.24,
                                0.0,
                                1.0
                            );

                        textureColor =
                            mix(
                                crumbColor,
                                fillingColor,
                                fillingMask
                            );

                        textureColor =
                            saturateColor(
                                textureColor,
                                1.16
                            );

                        textureColor =
                            adjustContrast(
                                textureColor,
                                1.10
                            );

                        textureColor.r *=
                            1.04;

                        textureColor.g *=
                            1.01;

                        textureColor *=
                            mix(
                                0.90,
                                1.0,
                                smoothstep(
                                    -0.2,
                                    0.75,
                                    abs(
                                        normalValue.z
                                    )
                                )
                            );

                        crumbRoughness =
                            clamp(
                                0.74 +
                                crumbRoughness *
                                0.22,
                                0.72,
                                0.98
                            );

                        fillingRoughness =
                            clamp(
                                0.22 +
                                fillingRoughness *
                                0.26,
                                0.20,
                                0.58
                            );

                        textureRoughness =
                            mix(
                                crumbRoughness,
                                fillingRoughness,
                                fillingMask
                            );
                    }


                    diffuseColor.rgb =
                        mix(
                            diffuseColor.rgb,
                            textureColor,
                            uTextureEnabled
                        );

                    customRoughness =
                        clamp(
                            textureRoughness,
                            0.18,
                            1.0
                        );`
                );


            shader.fragmentShader =
                shader.fragmentShader.replace(

                    "#include <roughnessmap_fragment>",

                    `#include <roughnessmap_fragment>

                    roughnessFactor =
                        mix(
                            roughnessFactor,
                            customRoughness,
                            uTextureEnabled *
                            0.96
                        );`
                );
        };


    material.customProgramCacheKey =
        function(){

            return (
                "almond-final-" +
                options.cacheKey
            );
        };


    return material;
}

function createVisualRoot(){

    const root =
        new THREE.Group();

    root.rotation.x =
        -Math.PI /
        2;

    root.scale.setScalar(
        sharedScale
    );

    return root;
}


function createAlignedMesh(
    geometry,
    material
){

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        -sharedCenter.x,
        -sharedCenter.y,
        -sharedCenter.z
    );

    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;

    return mesh;
}


function createStaticCookie(
    geometry
){

    const group =
        new THREE.Group();

    const root =
        createVisualRoot();

    root.add(
        createAlignedMesh(
            geometry,
            staticCookieMaterial
        )
    );

    group.add(
        root
    );

    return group;
}


function createTargetCookie(
    wholeGeometry,
    shellGeometry,
    coreGeometry
){

    const group =
        new THREE.Group();

    const root =
        createVisualRoot();


    targetWholeMesh =
        createAlignedMesh(
            wholeGeometry,
            targetWholeMaterial
        );


    targetShellMesh =
        createAlignedMesh(
            shellGeometry,
            targetShellMaterial
        );


    targetCoreMesh =
        createAlignedMesh(
            coreGeometry,
            targetCoreMaterial
        );


    root.add(
        targetWholeMesh,
        targetShellMesh,
        targetCoreMesh
    );

    group.add(
        root
    );

    return group;
}

}


/* ============================================================
   WOOD MATERIAL
   ============================================================ */

function createWoodMaterial(
    lightColor,
    darkColor,
    roughness
){

    const material =
        new THREE.MeshStandardMaterial({
            color:
                lightColor,
            roughness:
                roughness,
            metalness:
                0
        });


    const uniforms = {

        uLightColor:{
            value:
                new THREE.Color(
                    lightColor
                )
        },

        uDarkColor:{
            value:
                new THREE.Color(
                    darkColor
                )
        }
    };


    material.onBeforeCompile =
        function(
            shader
        ){

            Object.assign(
                shader.uniforms,
                uniforms
            );


            shader.vertexShader =
                shader.vertexShader.replace(
                    "#include <common>",
                    `#include <common>
                    varying vec3 vWoodPosition;`
                );


            shader.vertexShader =
                shader.vertexShader.replace(
                    "#include <begin_vertex>",
                    `#include <begin_vertex>
                    vWoodPosition =
                        position;`
                );


            shader.fragmentShader =
                shader.fragmentShader.replace(
                    "#include <common>",
                    `#include <common>
                    uniform vec3 uLightColor;
                    uniform vec3 uDarkColor;
                    varying vec3 vWoodPosition;`
                );


            shader.fragmentShader =
                shader.fragmentShader.replace(
                    "#include <color_fragment>",
                    `#include <color_fragment>

                    float grain =
                        0.5 +
                        0.5 *
                        sin(
                            vWoodPosition.y *
                            8.5 +
                            sin(
                                vWoodPosition.z *
                                2.9
                            ) *
                            1.7
                        );

                    float fineGrain =
                        0.5 +
                        0.5 *
                        sin(
                            vWoodPosition.y *
                            27.0
                        );

                    diffuseColor.rgb =
                        mix(
                            uDarkColor,
                            uLightColor,
                            grain *
                            0.82 +
                            fineGrain *
                            0.18
                        );`
                );
        };


    return material;
}


const chopstickWoodMaterial =
    createWoodMaterial(
        0xb76d38,
        0x5d2a18,
        0.64
    );


const chopstickEndMaterial =
    createWoodMaterial(
        0x80452a,

    );


/* ============================================================
   CAMERA BASIS
   ============================================================ */

function cameraBasis(){

    const forward =
        new THREE.Vector3();

    camera.getWorldDirection(
        forward
    );


    const right =
        new THREE.Vector3()
            .crossVectors(
                forward,
                camera.up
            )
            .normalize();


    const screenUp =
        new THREE.Vector3()
            .crossVectors(
                right,
                forward
            )
            .normalize();


    return {
        forward,
        right,
        screenUp
    };
}


/* ============================================================
   CHOPSTICKS
   ============================================================ */

const CHOPSTICK_TIP_RADIUS =
    0.055;

const GRIP_VISUAL_OVERLAP =
    0.10;

const CRYSTAL_GRIP_OVERLAP =
    0.16;

const REAR_LIFT_ANGLE =
    THREE.MathUtils.degToRad(
        16
    );

const CARRY_LIFT_ANGLE =
    THREE.MathUtils.degToRad(
        6
    );


let chopstickGroup =
    null;

let lowerChopstick =
    null;

let upperChopstick =
    null;


const almondGripQuaternion =
    new THREE.Quaternion();

const rearGripLevelQuaternion =
    new THREE.Quaternion();

const rearGripRaisedQuaternion =
    new THREE.Quaternion();

const rearGripCarryQuaternion =
    new THREE.Quaternion();

const crystalPreTurnQuaternion =
    new THREE.Quaternion();


function createSingleChopstick(){

    const pivot =
        new THREE.Group();

    const length =
        6.8;


    const stick =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.105,
                CHOPSTICK_TIP_RADIUS,
                length,
                24
            ),
            chopstickWoodMaterial
        );

    stick.rotation.x =
        Math.PI /
        2;

    stick.position.z =
        length *
        0.5;

    stick.castShadow =
        true;

    stick.receiveShadow =
        true;

    pivot.add(
        stick
    );


    const cap =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.112,
                0.112,
                0.38,
                24
            ),
            chopstickEndMaterial
        );

    cap.rotation.x =
        Math.PI /
        2;

    cap.position.z =
        length -
        0.19;

    cap.castShadow =
        true;

    cap.receiveShadow =
        true;

    pivot.add(
        cap
    );


    return pivot;
}


function createChopsticks(){

    chopstickGroup =
        new THREE.Group();

    lowerChopstick =
        createSingleChopstick();

    upperChopstick =
        createSingleChopstick();

    chopstickGroup.add(
        lowerChopstick,
        upperChopstick
    );

    scene.add(
        chopstickGroup
    );


    /*
     * Almond vertical screen-space grip.
     */

    const {
        forward,
        right,
        screenUp
    } =
        cameraBasis();


    const almondBasis =
        new THREE.Matrix4()
            .makeBasis(
                screenUp.clone()
                    .normalize(),
                forward.clone()
                    .negate()
                    .normalize(),
                right.clone()
                    .normalize()
            );


    almondGripQuaternion
        .setFromRotationMatrix(
            almondBasis
        );


    /*
     * Crystal rear grip.
     */

    rearGripLevelQuaternion.identity();


    const fullLift =
        new THREE.Quaternion()
            .setFromAxisAngle(
                new THREE.Vector3(
                    1,
                    0,
                    0
                ),
                -REAR_LIFT_ANGLE
            );


    const carryLift =
        new THREE.Quaternion()
            .setFromAxisAngle(
                new THREE.Vector3(
                    1,
                    0,
                    0
                ),
                -CARRY_LIFT_ANGLE
            );


    const yaw =
        new THREE.Quaternion()
            .setFromAxisAngle(
                new THREE.Vector3(
                    0,
                    1,
                    0
                ),
                -Math.PI /
                2
            );


    rearGripRaisedQuaternion
        .copy(
            rearGripLevelQuaternion
        )
        .multiply(
            fullLift
        );


    rearGripCarryQuaternion
        .copy(
            rearGripLevelQuaternion
        )
        .multiply(
            carryLift
        );


    crystalPreTurnQuaternion
        .copy(
            yaw
        )
        .multiply(
            rearGripLevelQuaternion
        );
}


function setChopstickGap(
    gap,
    spread
){

    lowerChopstick.position.x =
        -gap *
        0.5;

    upperChopstick.position.x =
        gap *
        0.5;

    lowerChopstick.rotation.y =
        -spread;

    upperChopstick.rotation.y =
        spread;
}


function measureSpanAlongAxis(
    mesh,
    axis
){

    scene.updateMatrixWorld(
        true
    );

    const position =
        mesh.geometry
            .getAttribute(
                "position"
            );

    const vertex =
        new THREE.Vector3();

    const normalizedAxis =
        axis.clone()
            .normalize();

    let minimum =
        Infinity;

    let maximum =
        -Infinity;


    for(
        let index = 0;
        index < position.count;
        index += 1
    ){

        vertex
            .fromBufferAttribute(
                position,
                index
            )
            .applyMatrix4(
                mesh.matrixWorld
            );

        const projection =
            vertex.dot(
                normalizedAxis
            );

        minimum =
            Math.min(
                minimum,
                projection
            );

        maximum =
            Math.max(
                maximum,
                projection
            );
    }


    return (
        maximum -
        minimum
    );
}


function viewPoint(
    distance,
    downward,
    horizontal = 0
){

    const {
        forward,
        right,
        screenUp
    } =
        cameraBasis();


    return camera.position
        .clone()
        .add(
            forward.clone()
                .multiplyScalar(
                    distance
                )
        )
        .add(
            screenUp.clone()
                .multiplyScalar(
                    -downward
                )
        )
        .add(
            right.clone()
                .multiplyScalar(
                    horizontal
                )
        );
}


/* ============================================================
   ALMOND CRUMBS
   ============================================================ */

const crumbParticles =
    [];

const MAX_CRUMBS =
    72;

const CRUMB_GRAVITY =
    6.4;

const crumbGeometry =
    new THREE.IcosahedronGeometry(
        1,
        0
    );

const crumbMaterial =
    new THREE.MeshStandardMaterial({
        color:0xd89445,
        roughness:0.92,
        metalness:0
    });

const lightCrumbMaterial =
    new THREE.MeshStandardMaterial({
        color:0xf1c77c,
        roughness:0.96,
        metalness:0
    });


function randomRange(
    minimum,
    maximum
){

    return (
        minimum +
        Math.random() *
        (
            maximum -
            minimum
        )
    );
}


function createCrumbPool(){

    for(
        let index = 0;
        index < MAX_CRUMBS;
        index += 1
    ){

        const mesh =
            new THREE.Mesh(
                crumbGeometry,
                index % 4 === 0
                    ? lightCrumbMaterial
                    : crumbMaterial
            );

        mesh.visible =
            false;

        mesh.castShadow =
            true;

        mesh.receiveShadow =
            true;

        scene.add(
            mesh
        );


        crumbParticles.push({

            mesh:
                mesh,

            active:
                false,

            velocity:
                new THREE.Vector3(),

            angularVelocity:
                new THREE.Vector3(),

            age:
                0,

            life:
                1,

            baseScale:
                0.05
        });
    }
}


function clearCrumbs(){

    for(
        const particle
        of crumbParticles
    ){

        particle.active =
            false;

        particle.mesh.visible =
            false;

        particle.age =
            0;
    }
}


function spawnCrumbBurst(
    worldPosition,
    count,
    options = {}
){

    const burstStrength =
        options.burstStrength ??
        1;

    const forwardBias =
        options.forwardBias ??
        0.25;

    const horizontalSpread =
        options.horizontalSpread ??
        1;

    const verticalSpread =
        options.verticalSpread ??
        1;

    const sizeMultiplier =
        options.sizeMultiplier ??
        1;

    const lifeMultiplier =
        options.lifeMultiplier ??
        1;

    const startSpread =
        options.startSpread ??
        0.16;

    const depthSpread =
        options.depthSpread ??
        0.06;


    const {
        forward,
        right,
        screenUp
    } =
        cameraBasis();


    for(
        let index = 0;
        index < count;
        index += 1
    ){

        const particle =
            crumbParticles.find(
                item =>
                    !item.active
            );

        if(
            !particle
        ){
            break;
        }


        particle.active =
            true;

        particle.age =
            0;

        particle.life =
            randomRange(
                0.75,
                1.55
            ) *
            lifeMultiplier;

        particle.baseScale =
            randomRange(
                0.035,
                0.09
            ) *
            sizeMultiplier;

        particle.mesh.visible =
            true;


        particle.mesh.position
            .copy(
                worldPosition
            )
            .add(
                right.clone()
                    .multiplyScalar(
                        randomRange(
                            -startSpread,
                            startSpread
                        )
                    )
            )
            .add(
                screenUp.clone()
                    .multiplyScalar(
                        randomRange(
                            -startSpread *
                            0.75,
                            startSpread *
                            0.75
                        )
                    )
            )
            .add(
                forward.clone()
                    .multiplyScalar(
                        randomRange(
                            -depthSpread,
                            depthSpread
                        )
                    )
            );


        particle.mesh.scale.setScalar(
            particle.baseScale
        );


        particle.mesh.rotation.set(
            Math.random() *
            Math.PI,
            Math.random() *
            Math.PI,
            Math.random() *
            Math.PI
        );


        particle.velocity
            .copy(
                right
            )
            .multiplyScalar(
                randomRange(
                    -1.05,
                    1.05
                ) *
                burstStrength *
                horizontalSpread
            )
            .add(
                screenUp.clone()
                    .multiplyScalar(
                        randomRange(
                            -0.15,
                            1
                        ) *
                        burstStrength *
                        verticalSpread
                    )
            )
            .add(
                forward.clone()
                    .multiplyScalar(
                        randomRange(
                            -0.25,
                            0.55
                        ) *
                        burstStrength +
                        forwardBias
                    )
            );


        particle.velocity.y +=
            randomRange(
                0.25,
                1.25
            ) *
            burstStrength;


        particle.angularVelocity.set(
            randomRange(
                -8,
                8
            ),
            randomRange(
                -8,
                8
            ),
            randomRange(
                -8,
                8
            )
        );
    }
}


function updateCrumbs(
    deltaTime
){

    /*
     * A zero delta means the animation is paused.
     */

    if(
        deltaTime <=
        0
    ){
        return;
    }


    for(
        const particle
        of crumbParticles
    ){

        if(
            !particle.active
        ){
            continue;
        }


        particle.age +=
            deltaTime;


        if(
            particle.age >=
            particle.life
        ){

            particle.active =
                false;

            particle.mesh.visible =
                false;

            continue;
        }


        particle.velocity.y -=
            CRUMB_GRAVITY *
            deltaTime;


        particle.velocity.multiplyScalar(
            Math.pow(
                0.985,
                deltaTime *
                60
            )
        );


        particle.mesh.position.addScaledVector(
            particle.velocity,
            deltaTime
        );


        particle.mesh.rotation.x +=
            particle.angularVelocity.x *
            deltaTime;

        particle.mesh.rotation.y +=
            particle.angularVelocity.y *
            deltaTime;

        particle.mesh.rotation.z +=
            particle.angularVelocity.z *
            deltaTime;


        const horizontalDistance =
            Math.hypot(
                particle.mesh.position.x,
                particle.mesh.position.z
            );


        const floorY =
            horizontalDistance <
            4.2
                ? 0.58
                : 0.03;


        if(
            particle.mesh.position.y <
            floorY
        ){

            particle.mesh.position.y =
                floorY;

            if(
                particle.velocity.y <
                0
            ){

                particle.velocity.y *=
                    -0.28;

                particle.velocity.x *=
                    0.68;

                particle.velocity.z *=
                    0.68;
            }
        }


        const remaining =
            1 -
            particle.age /
            particle.life;


        const shrink =
            remaining <
            0.25
                ? remaining /
                    0.25
                : 1;


        particle.mesh.scale.setScalar(
            particle.baseScale *
            Math.max(
                0.001,
                shrink
            )
        );
    }
}

function createJellyMaterial(
    phase,
    minimumZ,
    height,
    petal = false
){

    const material =
        new THREE.MeshPhysicalMaterial({

            color:
                petal
                    ? 0xe58c28
                    : 0xffd66c,

            roughness:
                petal
                    ? 0.27
                    : 0.11,

            transparent:true,

            opacity:
                petal
                    ? 0.90
                    : 0.60,

            transmission:
                petal
                    ? 0.10
                    : 0.66,

            thickness:
                petal
                    ? 0.18
                    : 1.10,

            ior:1.34,

            clearcoat:
                petal
                    ? 0.42
                    : 0.84,

            clearcoatRoughness:
                petal
                    ? 0.16
                    : 0.06,

            side:
                THREE.DoubleSide,

            depthWrite:false
        });


    material.forceSinglePass =
        true;


    const uniforms = {

        uTime:{
            value:0
        },

        uEnergy:{
            value:0
        },

        uPhase:{
            value:
                phase
        },

        uMinZ:{
            value:
                minimumZ
        },

        uHeight:{
            value:
                Math.max(
                    height,
                    0.001
                )
        }
    };


    material.userData.uniforms =
        uniforms;


    material.onBeforeCompile =
        function(
            shader
        ){

            Object.assign(
                shader.uniforms,
                uniforms
            );


            shader.vertexShader =
                shader.vertexShader.replace(

                    "#include <common>",

                    `#include <common>

                    uniform float uTime;
                    uniform float uEnergy;
                    uniform float uPhase;
                    uniform float uMinZ;
                    uniform float uHeight;`
                );


            shader.vertexShader =
                shader.vertexShader.replace(

                    "#include <begin_vertex>",

                    `#include <begin_vertex>

                    float h =
                        clamp(
                            (
                                position.z -
                                uMinZ
                            ) /
                            uHeight,
                            0.0,
                            1.0
                        );

                    float anchor =
                        smoothstep(
                            0.03,
                            0.36,
                            h
                        );

                    float w1 =
                        sin(
                            uTime *
                            10.5 +
                            uPhase +
                            h *
                            4.2 +
                            position.x *
                            0.052
                        );

                    float w2 =
                        cos(
                            uTime *
                            12.4 +
                            uPhase *
                            1.7 +
                            h *
                            2.9 -
                            position.y *
                            0.05
                        );

                    float w3 =
                        sin(
                            uTime *
                            8.7 +
                            uPhase *
                            0.72 +
                            position.x *
                            0.034 +
                            position.y *
                            0.032
                        );

                    transformed.x +=
                        (
                            w1 *
                            0.82 +
                            w2 *
                            0.32
                        ) *
                        uEnergy *
                        anchor;

                    transformed.y +=
                        (
                            w2 *
                            0.68 +
                            w3 *
                            0.26
                        ) *
                        uEnergy *
                        anchor;

                    transformed.z +=
                        w3 *
                        uEnergy *
                        0.36 *
                        anchor;`
                );
        };


    return material;
}

function createCrystalCake(
    wholeBodyGeometry,
    wholePetalGeometry,
    bittenBodyGeometry,
    bittenPetalGeometry,
    center,
    size,
    phase
){

    const group =
        new THREE.Group();

    const root =
        new THREE.Group();


    root.rotation.x =
        -Math.PI /
        2;

    root.scale.setScalar(
        sharedScale
    );


    const minimumZ =
        center.z -
        size.z *
        0.5;


    const wholeBodyMaterial =
        createJellyMaterial(
            phase,
            minimumZ,
            size.z,
            false
        );

    const wholePetalMaterial =
        createJellyMaterial(
            phase + 0.17,
            minimumZ,
            size.z,
            true
        );

    const bittenBodyMaterial =
        createJellyMaterial(
            phase,
            minimumZ,
            size.z,
            false
        );

    const bittenPetalMaterial =
        createJellyMaterial(
            phase + 0.17,
            minimumZ,
            size.z,
            true
        );


    const wholeBody =
        crystalAlignedMesh(
            wholeBodyGeometry,
            wholeBodyMaterial,
            center
        );

    const wholePetals =
        crystalAlignedMesh(
            wholePetalGeometry,
            wholePetalMaterial,
            center
        );

    const bittenBody =
        crystalAlignedMesh(
            bittenBodyGeometry,
            bittenBodyMaterial,
            center
        );

    const bittenPetals =
        crystalAlignedMesh(
            bittenPetalGeometry,
            bittenPetalMaterial,
            center
        );


    wholeBody.renderOrder =
        2;

    bittenBody.renderOrder =
        2;

    wholePetals.renderOrder =
        3;

    bittenPetals.renderOrder =
        3;


    bittenBody.visible =
        false;

    bittenPetals.visible =
        false;


    root.add(
        wholeBody,
        wholePetals,
        bittenBody,
        bittenPetals
    );

    group.add(
        root
    );


    group.userData.jelly = {

        phase:
            phase,

        energy:
            0,

        biteCompression:
            0,

        wholeBody:
            wholeBody,

        wholePetals:
            wholePetals,

        bittenBody:
            bittenBody,

        bittenPetals:
            bittenPetals,

        homePosition:
            new THREE.Vector3(),

        homeQuaternion:
            new THREE.Quaternion(),

        baseQuaternion:
            new THREE.Quaternion()
    };


    crystalCakes.push(
        group
    );


    return group;
}

const wobbleEuler =
    new THREE.Euler();

const wobbleQuaternion =
    new THREE.Quaternion();


function updateJelly(
    deltaTime,
    elapsedTime
){

    /*
     * Pause freezes jelly simulation completely.
     */

    if(
        deltaTime <=
        0
    ){
        return;
    }


    for(
        const cake
        of crystalCakes
    ){

        const data =
            cake.userData.jelly;


        data.energy *=
            Math.exp(
                -deltaTime *
                2.05
            );


        const energy =
            Math.min(
                1.20,
                data.energy
            );


        const waveA =
            Math.sin(
                elapsedTime *
                8.8 +
                data.phase
            );

        const waveB =
            Math.sin(
                elapsedTime *
                11.6 +
                data.phase *
                1.63
            );

        const waveC =
            Math.cos(
                elapsedTime *
                7.2 +
                data.phase *
                0.83
            );


        wobbleEuler.set(

            waveA *
            energy *
            0.070,

            waveC *
            energy *
            0.025,

            waveB *
            energy *
            0.090
        );


        wobbleQuaternion.setFromEuler(
            wobbleEuler
        );


        cake.quaternion
            .copy(
                data.baseQuaternion
            )
            .multiply(
                wobbleQuaternion
            );


        const verticalScale =
            1 +
            waveA *
            energy *
            0.038;


        const compression =
            data.biteCompression;


        cake.scale.set(

            (
                1 -
                (
                    verticalScale -
                    1
                ) *
                0.46
            ) *
            (
                1 +
                compression *
                0.10
            ),

            verticalScale *
            (
                1 -
                compression *
                0.14
            ),

            (
                1 -
                (
                    verticalScale -
                    1
                ) *
                0.34
            ) *
            (
                1 +
                compression *
                0.06
            )
        );


        for(
            const material
            of data.materials
        ){

            material
                .userData
                .uniforms
                .uTime
                .value =
                elapsedTime;

            material
                .userData
                .uniforms
                .uEnergy
                .value =
                energy;
        }
    }
}

        )
    );


    particle.velocity.set(

        ),

            0.38,
            0.68
        ),
        randomRange(
            -0.05,
            0.05
        )
    );


    particle.phase =
        Math.random() *

    particle.scaleBase =
        randomRange(

        );


    particle.sprite.position.copy(

function createSteamSystem(){

    steamGroup =
        new THREE.Group();

    steamerStageGroup.add(
        steamGroup
    );


    for(
        let index = 0;
        index < 28;
        index += 1
    ){

        const material =
            new THREE.SpriteMaterial({
                map:
                    steamTexture,
                color:
                    0xfff4df,
                transparent:
                    true,
                opacity:
                    0,
                depthWrite:
                    false,
                blending:
                    THREE.NormalBlending,
                toneMapped:
                    false
            });


        const sprite =
            new THREE.Sprite(
                material
            );


        const particle = {

            sprite:
                sprite,

            position:
                new THREE.Vector3(),

            velocity:
                new THREE.Vector3(),

            age:
                0,

            life:
                3,

            baseOpacity:
                0.15,

            phase:
                0,

            scaleBase:
                0.6
        };


        steamGroup.add(
            sprite
        );

        steamParticles.push(
            particle
        );

        resetSteamParticle(
            particle,
            true
        );
    }


    steamGroup.visible =
        false;
}


function updateSteam(
    deltaTime,
    elapsedTime
){

    if(
        !steamGroup ||
        !steamVisible
    ){
        return;
    }


    steamGroup.visible =
        true;


    /*
     * Pause freezes all steam particles.
     */

    if(
        deltaTime <=
        0
    ){
        return;
    }


    for(
        const particle
        of steamParticles
    ){

        particle.age +=
            deltaTime;


        if(
            particle.age >=
            particle.life
        ){

            resetSteamParticle(
                particle,
                false
            );

            continue;
        }


        const lifeProgress =
            particle.age /
            particle.life;


        particle.position.addScaledVector(
            particle.velocity,
            deltaTime
        );


        particle.position.x +=
            Math.sin(
                elapsedTime *
                1.45 +
                particle.phase
            ) *
            0.055 *
            deltaTime;


        particle.position.z +=
            Math.cos(
                elapsedTime *
                1.10 +
                particle.phase
            ) *
            0.025 *
            deltaTime;


        particle.sprite.position.copy(
            particle.position
        );


        const fade =
            Math.sin(
                Math.PI *
                Math.min(
                    1,
                    lifeProgress
                )
            );


        particle.sprite.material.opacity =
            particle.baseOpacity *
            Math.pow(
                Math.max(
                    0,
                    fade
                ),
                1.15
            );


        const scale =
            particle.scaleBase *
            (
                1 +
                lifeProgress *
                1.25
            );


        particle.sprite.scale.set(
            scale,
            scale *
            0.88,
            1
        );
    }
}

function clamp01(
    value
){

    return Math.min(
        Math.max(
            value,
            0
        ),
        1
    );
}


function easeInOutCubic(
    value
){

    return value <
        0.5
        ? 4 *
            value *
            value *
            value
        : 1 -
            Math.pow(
                -2 *
                value +
                2,
                3
            ) /
            2;
}


function easeOutBack(
    value
){

    const c1 =
        1.70158;

    const c3 =
        c1 +
        1;

    return (
        1 +
        c3 *
        Math.pow(
            value -
            1,
            3
        ) +
        c1 *
        Math.pow(
            value -
            1,
            2
        )
    );
}

        Math.max(
            verticalCookieSpan +
            CHOPSTICK_TIP_RADIUS *
            2 -
            GRIP_VISUAL_OVERLAP *
            2,
            CHOPSTICK_TIP_RADIUS *
            2
        );


    almondOpenGap =
        almondGripGap +
        1;


    const {
        forward,
        right,
        screenUp
    } =
        cameraBasis();


    almondStartPosition
        .copy(
            almondGripPosition
        )
        .add(
            right.clone()
                .multiplyScalar(
                    5
                )
        )
        .add(
            screenUp.clone()
                .multiplyScalar(
                    1.4
                )
        )
        .add(
            forward.clone()
                .multiplyScalar(
                    -1
                )
        );


    almondLiftPosition
        .copy(
            almondGripPosition
        )
        .add(
            screenUp.clone()
                .multiplyScalar(
                    1.55
                )
        )
        .add(
            forward.clone()
                .multiplyScalar(
                    -1
                )
        );
}


function attachAlmond(){

    chopstickGroup.attach(
        targetCookie
    );


    const cookieWorld =
        new THREE.Vector3();

    const groupWorld =
        new THREE.Vector3();


    targetCookie.getWorldPosition(
        cookieWorld
    );

    chopstickGroup.getWorldPosition(
        groupWorld
    );


    attachedAlmondOffset.copy(
        cookieWorld.sub(
            groupWorld
        )
    );
}


/* ============================================================
   PLATE COOKIE INERTIA
   ============================================================ */

function updatePlateCookieInertia(
    progress,
    elapsedTime,
    settling = false
){

    const envelope =
        settling
            ? Math.exp(
                -stateTime *
                4.2
            )
            : Math.sin(
                progress *
                Math.PI
            );


    const amount =
        envelope *
        (
            settling
                ? 0.10
                : 0.15
        );


    lowerLeftCookie.position.set(
        lowerLeftHome.x +
        Math.sin(
            elapsedTime *
            10.4
        ) *
        amount,
        lowerLeftHome.y,
        lowerLeftHome.z +
        Math.cos(
            elapsedTime *
            8.4
        ) *
        amount *
        0.40
    );


    lowerRightCookie.position.set(
        lowerRightHome.x +
        Math.sin(
            elapsedTime *
            10.4 +
            1.4
        ) *
        amount,
        lowerRightHome.y,
        lowerRightHome.z +
        Math.cos(
            elapsedTime *
            8.4 +
            1.2
        ) *
        amount *
        0.40
    );


    lowerLeftCookie.rotation.z =
        Math.sin(
            elapsedTime *
            11.2
        ) *
        amount *
        0.12;


    lowerRightCookie.rotation.z =
        Math.sin(
            elapsedTime *
            11.2 +
            1.6
        ) *
        amount *
        0.12;
}


function restoreLowerCookies(){

    lowerLeftCookie.position.copy(
        lowerLeftHome
    );

    lowerRightCookie.position.copy(
        lowerRightHome
    );


    lowerLeftCookie.rotation.set(
        0,
        -0.13,
        0
    );

    lowerRightCookie.rotation.set(
        0,
        0.11,
        0
    );
}
